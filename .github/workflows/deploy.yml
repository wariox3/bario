name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      apps:
        description: 'Que desplegar: "all", o lista separada por comas (erp,landing). Vacio = calcular affected.'
        required: false
        default: all

permissions:
  contents: read
  # nx-set-shas consulta la API de runs para ubicar la ultima corrida exitosa.
  actions: read

jobs:
  check-affected:
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.check.outputs.landing }}
      erp: ${{ steps.check.outputs.erp }}
      cuenta: ${{ steps.check.outputs.cuenta }}
      transporte: ${{ steps.check.outputs.transporte }}
      pos: ${{ steps.check.outputs.pos }}
      turnos: ${{ steps.check.outputs.turnos }}
      cliente: ${{ steps.check.outputs.cliente }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Derive SHAs for Nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Check affected apps
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_APPS: ${{ github.event.inputs.apps }}
          # Por env, no interpolado en el script: el mensaje lo escribe quien commitea.
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          ALL_APPS="landing erp cuenta transporte pos turnos cliente"

          # Escotilla para desplegar sin esperar a que Nx marque algo: el disparo
          # manual, o un [deploy-all] en el mensaje del commit (sirve en el titulo
          # del PR, que GitHub copia al cuerpo del merge commit).
          FORCE=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            FORCE="${DISPATCH_APPS:-all}"
          elif printf '%s' "${HEAD_COMMIT_MSG:-}" | grep -qF '[deploy-all]'; then
            FORCE="all"
          fi

          if [ -n "$FORCE" ]; then
            echo "Despliegue forzado ($EVENT_NAME): $FORCE"
            if [ "$FORCE" = "all" ]; then
              AFFECTED=$(printf '%s\n' $ALL_APPS)
            else
              AFFECTED=$(printf '%s' "$FORCE" | tr ',' '\n' | tr -d ' ')
            fi
          else
            echo "NX_BASE=$NX_BASE"
            echo "NX_HEAD=$NX_HEAD"

            # La metadata del release (commit-and-tag-version) solo cambia version:
            # package.json/package-lock.json/CHANGELOG.md. En Nx cada uno marca TODAS
            # las apps como affected, asi que la excluimos para no desplegar de mas.
            #
            # El diff va a su propia variable, sin pipe: encadenarlo a `paste` hacia
            # que un `git diff` roto (SHA ausente) devolviera exit 0 y lista vacia,
            # indistinguible de "no cambio nada" -> el deploy se saltaba en silencio.
            DIFF=$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- . \
              ':(exclude)package.json' \
              ':(exclude)package-lock.json' \
              ':(exclude)CHANGELOG.md')
            CHANGED=$(printf '%s' "$DIFF" | paste -sd, -)
            echo "Archivos cambiados: ${CHANGED:-<ninguno>}"

            if [ -z "$CHANGED" ]; then
              AFFECTED=""
            else
              # Sin `2>/dev/null || echo ""`: si Nx falla, el paso muere y se ve.
              AFFECTED=$(npx nx show projects --affected --files="$CHANGED" --type=app)
            fi
          fi

          echo "Apps afectadas: ${AFFECTED:-<ninguna>}"

          for app in $ALL_APPS; do
            if printf '%s\n' "$AFFECTED" | grep -qx "$app"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done

  deploy-landing:
    needs: check-affected
    if: needs.check-affected.outputs.landing == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (staging)
        if: github.ref == 'refs/heads/dev'
        run: npx nx build landing --configuration=staging

      - name: Build (prod)
        if: github.ref == 'refs/heads/main'
        run: npx nx build landing --configuration=production

      - name: Set deploy variables (dev)
        if: github.ref == 'refs/heads/dev'
        run: |
          echo "DEPLOY_HOST=${{ secrets.DEV_HOST }}" >> $GITHUB_ENV
          echo "DEPLOY_USER=${{ secrets.DEV_SSH_USER }}" >> $GITHUB_ENV
          echo "DEPLOY_PATH=${{ secrets.LANDING_DEV_DEPLOY_PATH }}" >> $GITHUB_ENV

      - name: Set deploy variables (prod)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "DEPLOY_HOST=${{ secrets.PROD_HOST }}" >> $GITHUB_ENV
          echo "DEPLOY_USER=${{ secrets.PROD_SSH_USER }}" >> $GITHUB_ENV
          echo "DEPLOY_PATH=${{ secrets.LANDING_PROD_DEPLOY_PATH }}" >> $GITHUB_ENV

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/deploy_key
          else
            echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Validate deploy path
        run: |
          if [[ "$DEPLOY_PATH" == "/var/www/html" || "$DEPLOY_PATH" == "/var/www" || -z "$DEPLOY_PATH" ]]; then
            echo "ERROR: DEPLOY_PATH '$DEPLOY_PATH' is too broad."
            exit 1
          fi

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            dist/apps/landing/browser/ \
            ${{ env.DEPLOY_USER }}@${{ env.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

