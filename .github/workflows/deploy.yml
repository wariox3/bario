name: Deploy

# Despliega por rsync solo las apps afectadas por el push.
#
#   main → configuration=production → secrets PROD_*  → environment "production"
#   dev  → configuration=staging    → secrets DEV_*   → environment "staging"
#
# Secrets esperados (por entorno, <ENV> = PROD | DEV):
#   <ENV>_HOST, <ENV>_SSH_USER, <ENV>_SSH_KEY, <APP>_<ENV>_DEPLOY_PATH
# Variable opcional (Settings → Variables): <ENV>_SSH_KNOWN_HOSTS
#   Salida de `ssh-keyscan -H <host>`. Si falta, se hace keyscan en cada run
#   (trust-on-first-use) y se avisa con un warning.

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.interface-design/**'
      - '.agents/**'
      - '.claude/**'
      - '.vscode/**'
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps a desplegar separadas por coma (erp,turnos) o "all". Vacío = solo las afectadas.'
        required: false
        default: ''

permissions:
  contents: read
  actions: read # nx-set-shas consulta los runs anteriores del workflow

# Un despliegue por rama a la vez. Sin cancelar: cortar un rsync a medias
# dejaría el sitio inconsistente; el run siguiente espera en cola.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 22

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      apps: ${{ steps.affected.outputs.apps }}
      target: ${{ steps.target.outputs.target }}
      secret_prefix: ${{ steps.target.outputs.secret_prefix }}

    steps:
      - name: Resolve target environment
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            main) target=production; prefix=PROD ;;
            dev)  target=staging;    prefix=DEV ;;
            *)
              echo "::error::Solo se despliega desde main o dev (rama actual: $GITHUB_REF_NAME)."
              exit 1 ;;
          esac
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "secret_prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # main-branch-name = la rama que se está desplegando. Sin esto, en dev la
      # base sería el último deploy exitoso de MAIN y se redesplegaría todo lo
      # que dev acumula desde la última merge.
      - name: Derive SHAs for Nx affected
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.ref_name }}

      - name: Resolve apps to deploy
        id: affected
        env:
          REQUESTED: ${{ inputs.apps }}
        run: |
          all_apps=$(npx nx show projects --type=app | sort)

          # ¿package.json / package-lock.json cambiaron solo por el bump de
          # versión del release? Entonces se excluyen del diff: para Nx un
          # lockfile tocado marca TODAS las apps como affected. Si cambió
          # cualquier otra cosa (deps), se dejan pasar y se despliega todo.
          release_only() {
            local f
            for f in package.json package-lock.json; do
              git diff --quiet "$NX_BASE" "$NX_HEAD" -- "$f" && continue
              git cat-file -e "$NX_BASE:$f" 2>/dev/null || return 1
              local strip='del(.version, .packages[""].version)'
              cmp -s <(git show "$NX_BASE:$f" | jq -S "$strip") \
                     <(git show "$NX_HEAD:$f" | jq -S "$strip") || return 1
            done
            return 0
          }

          if [ -n "$REQUESTED" ]; then
            if [ "$REQUESTED" = "all" ]; then
              selected=$all_apps
            else
              selected=$(tr -d '[:space:]' <<<"$REQUESTED" | tr ',' '\n' | sed '/^$/d')
              for app in $selected; do
                grep -qx "$app" <<<"$all_apps" || {
                  echo "::error::'$app' no es una app del workspace. Apps: $(paste -sd' ' <<<"$all_apps")"
                  exit 1
                }
              done
            fi
            reason="pedido manual (workflow_dispatch)"
          else
            excludes=(':(exclude)CHANGELOG.md')
            if release_only; then
              excludes+=(':(exclude)package.json' ':(exclude)package-lock.json')
            fi
            changed=$(git diff --name-only "$NX_BASE" "$NX_HEAD" -- . "${excludes[@]}")
            if [ -z "$changed" ]; then
              selected=""
            else
              selected=$(npx nx show projects --affected --type=app \
                --files="$(paste -sd, - <<<"$changed")")
            fi
            reason="afectadas entre ${NX_BASE::7} y ${NX_HEAD::7}"
          fi

          apps=$(jq -nc --arg s "$selected" '
            $s | split("\n") | map(select(length > 0)) | sort
              | map({ name: ., key: (ascii_upcase | gsub("-"; "_")) })')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

          {
            echo "## Deploy · ${{ steps.target.outputs.target }}"
            echo
            echo "Criterio: $reason"
            echo
            if [ "$apps" = "[]" ]; then
              echo "Ninguna app afectada. No se despliega nada."
            else
              jq -r '.[] | "- \(.name)"' <<<"$apps"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.plan.outputs.target }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      APP: ${{ matrix.name }}
      BUILD_CONFIGURATION: ${{ needs.plan.outputs.target }}
      DEPLOY_HOST: ${{ secrets[format('{0}_HOST', needs.plan.outputs.secret_prefix)] }}
      DEPLOY_USER: ${{ secrets[format('{0}_SSH_USER', needs.plan.outputs.secret_prefix)] }}
      DEPLOY_PATH: ${{ secrets[format('{0}_{1}_DEPLOY_PATH', matrix.key, needs.plan.outputs.secret_prefix)] }}

    steps:
      # Antes de gastar minutos en el build: si falta un secret o la ruta es
      # peligrosa para `rsync --delete`, se corta acá.
      - name: Validate deploy target
        env:
          PATH_SECRET: ${{ format('{0}_{1}_DEPLOY_PATH', matrix.key, needs.plan.outputs.secret_prefix) }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [ -n "$DEPLOY_HOST" ] || fail "Falta el secret ${{ needs.plan.outputs.secret_prefix }}_HOST."
          [ -n "$DEPLOY_USER" ] || fail "Falta el secret ${{ needs.plan.outputs.secret_prefix }}_SSH_USER."
          [ -n "$DEPLOY_PATH" ] || fail "Falta el secret $PATH_SECRET."

          path="${DEPLOY_PATH%/}"
          [[ "$path" == /* ]] || fail "$PATH_SECRET debe ser una ruta absoluta."
          [[ "$path" != *..* ]] || fail "$PATH_SECRET no puede contener '..'."
          for forbidden in "" /var/www /var/www/html /home /srv /opt /usr/share/nginx/html; do
            [ "$path" != "$forbidden" ] || fail "$PATH_SECRET apunta a una carpeta demasiado amplia para rsync --delete."
          done

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npx nx build "$APP" --configuration="$BUILD_CONFIGURATION"

      # Un build "exitoso" con la carpeta vacía o movida haría que rsync --delete
      # vacíe el servidor. index.html tiene que estar donde se va a sincronizar.
      - name: Verify build output
        run: |
          out="dist/apps/$APP/browser"
          [ -f "$out/index.html" ] || {
            echo "::error::No existe $out/index.html. Se aborta para no vaciar el servidor."
            exit 1
          }
          du -sh "$out"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets[format('{0}_SSH_KEY', needs.plan.outputs.secret_prefix)] }}
          SSH_KNOWN_HOSTS: ${{ vars[format('{0}_SSH_KNOWN_HOSTS', needs.plan.outputs.secret_prefix)] }}
        run: |
          [ -n "$SSH_KEY" ] || { echo "::error::Falta el secret ${{ needs.plan.outputs.secret_prefix }}_SSH_KEY."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          (umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key)
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::No hay ${{ needs.plan.outputs.secret_prefix }}_SSH_KNOWN_HOSTS; se confía en la clave del host que devuelva ssh-keyscan (TOFU)."
            ssh-keyscan -H "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          [ -s ~/.ssh/known_hosts ] || { echo "::error::No se obtuvo la clave del host $DEPLOY_HOST."; exit 1; }

      # --delay-updates: los archivos nuevos entran todos juntos al final.
      # --delete-after: lo viejo se borra después de copiar. Entre ambos, la
      # ventana en la que index.html apunta a chunks que aún no existen es mínima.
      - name: Deploy via rsync
        run: |
          rsync -az --delete-after --delay-updates --stats --human-readable \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=20" \
            "dist/apps/$APP/browser/" \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Summary
        run: |
          {
            echo "### ${APP} → ${BUILD_CONFIGURATION}"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` desplegado."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
