<header class="nav" [class.is-scrolled]="scrolled()">
  <div class="container-edit nav-row">
    <a class="brand" href="#top" (click)="closeMobile()" aria-label="RedDoc — inicio">
      <img class="brand-logo" src="/logos/reddoc.svg" alt="RedDoc" width="140" height="28" />
    </a>

    <nav class="nav-links" aria-label="Primary">
      <a href="#how">{{ t().nav.how }}</a>
      <a href="#product">{{ t().nav.product }}</a>
      <a href="#pricing">{{ t().nav.pricing }}</a>
      <a href="#contact">{{ t().nav.contact }}</a>
    </nav>

    <div class="nav-tools">
      <div class="lang" role="group" [attr.aria-label]="t().nav.langLabel">
        <button type="button" [class.active]="lang() === 'es'" (click)="setLang('es')">ES</button>
        <span class="lang-sep">/</span>
        <button type="button" [class.active]="lang() === 'en'" (click)="setLang('en')">EN</button>
      </div>
      <a class="btn btn-ghost" [href]="appUrl + '/auth/login'">{{ t().nav.login }}</a>
      <a class="btn btn-primary" [href]="appUrl + '/auth/register'">{{ t().nav.register }}</a>
      <button
        type="button"
        class="burger"
        (click)="toggleMobile()"
        [attr.aria-expanded]="mobileOpen()"
        aria-label="Menu"
      >
        <span></span><span></span>
      </button>
    </div>
  </div>

  @if (mobileOpen()) {
    <div class="mobile-panel">
      <a href="#how" (click)="closeMobile()">{{ t().nav.how }}</a>
      <a href="#product" (click)="closeMobile()">{{ t().nav.product }}</a>
      <a href="#pricing" (click)="closeMobile()">{{ t().nav.pricing }}</a>
      <a href="#contact" (click)="closeMobile()">{{ t().nav.contact }}</a>
      <div class="mobile-lang">
        <button type="button" [class.active]="lang() === 'es'" (click)="setLang('es')">ES</button>
        <button type="button" [class.active]="lang() === 'en'" (click)="setLang('en')">EN</button>
      </div>
      <div class="mobile-auth">
        <a class="btn btn-ghost" [href]="appUrl + '/auth/login'" (click)="closeMobile()">{{
          t().nav.login
        }}</a>
        <a class="btn btn-primary" [href]="appUrl + '/auth/register'" (click)="closeMobile()">{{
          t().nav.register
        }}</a>
      </div>
    </div>
  }
</header>
