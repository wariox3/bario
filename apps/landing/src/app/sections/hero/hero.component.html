<section class="hero">
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="container-edit hero-grid">
    <div class="hero-headline">
      <h1 class="title rise" style="animation-delay: 0.12s">
        <span class="line">{{ t().hero.headline_1 }}</span>
        <span class="line">
          <span class="title-accent">{{ t().hero.headline_italic }}</span
          >&ngsp;{{ t().hero.headline_2 }}
        </span>
      </h1>

      <p class="subtitle rise" style="animation-delay: 0.18s">
        {{ t().hero.subtitle }}
      </p>

      <p class="lede rise" style="animation-delay: 0.22s">
        {{ t().hero.lede }}
      </p>

      <div class="hero-actions rise" style="animation-delay: 0.3s">
        <a class="btn btn-primary" href="#pricing">
          {{ t().hero.primary }}
          <svg class="arrow" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path
              d="M2 7h10M8 3l4 4-4 4"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
        <a class="btn btn-ghost" href="#product">
          {{ t().hero.secondary }}
          <svg class="arrow" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path
              d="M3 11l8-8M5 3h6v6"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </div>
    </div>

    <aside class="hero-stage" [attr.aria-label]="t().hero.invoice.title">
      <figure class="invoice fade" style="animation-delay: 0.35s">
        <header class="inv-head">
          <img src="/logos/reddoc.svg" alt="RedDoc" class="inv-logo" width="80" height="16" />
          <span class="inv-meta">
            <span class="inv-title">{{ t().hero.invoice.title }}</span>
            <span class="inv-num tabular">{{ t().hero.invoice.number }}</span>
          </span>
        </header>

        <div class="inv-parties">
          <div class="inv-party">
            <span class="inv-party-label">{{ t().hero.invoice.fromLabel }}</span>
            <span class="inv-party-value">{{ t().hero.invoice.from }}</span>
          </div>
          <span class="inv-arrow" aria-hidden="true">
            <svg viewBox="0 0 14 14" fill="none">
              <path
                d="M2 7h10M8 3l4 4-4 4"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <div class="inv-party">
            <span class="inv-party-label">{{ t().hero.invoice.toLabel }}</span>
            <span class="inv-party-value">{{ t().hero.invoice.to }}</span>
          </div>
        </div>

        <ul class="inv-items">
          @for (it of t().hero.invoice.items; track it.label; let i = $index) {
            <li class="inv-item" [style.animation-delay]="0.55 + i * 0.08 + 's'">
              <span class="inv-item-label">{{ it.label }}</span>
              <span class="inv-item-amount tabular">{{ it.amount }}</span>
            </li>
          }
        </ul>

        <div class="inv-totals">
          <div class="inv-row">
            <span class="inv-row-label">{{ t().hero.invoice.subtotalLabel }}</span>
            <span class="inv-row-amount tabular">{{ t().hero.invoice.subtotalAmount }}</span>
          </div>
          <div class="inv-row">
            <span class="inv-row-label">{{ t().hero.invoice.taxLabel }}</span>
            <span class="inv-row-amount tabular">{{ t().hero.invoice.taxAmount }}</span>
          </div>
        </div>

        <div class="inv-grand">
          <span class="inv-grand-label">{{ t().hero.invoice.totalLabel }}</span>
          <span class="inv-grand-amount tabular">$ {{ t().hero.invoice.totalAmount }}</span>
        </div>

        <footer class="inv-foot">
          <span class="inv-stamp">
            <span class="inv-stamp-tick" aria-hidden="true">
              <svg viewBox="0 0 14 14" fill="none">
                <path
                  d="M2 7.5l3 3 7-7"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            {{ t().hero.invoice.stamp }}
          </span>
          <div class="inv-foot-meta">
            <span class="inv-status">{{ t().hero.invoice.statusNote }}</span>
            <span class="inv-cufe tabular">
              {{ t().hero.invoice.cufeLabel }} · {{ t().hero.invoice.cufeValue }}
            </span>
          </div>
        </footer>
      </figure>
    </aside>
  </div>
</section>
