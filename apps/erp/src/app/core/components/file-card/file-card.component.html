<div
  class="flex items-center gap-3 rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface px-4 py-3 transition-opacity"
  [class.opacity-60]="busy()"
>
  <span
    class="flex h-11 w-11 shrink-0 items-center justify-center rounded-[10px]"
    [class]="tono() === 'emerald' ? 'bg-emerald-50 text-emerald-700' : 'bg-sky-50 text-sky-700'"
  >
    <i class="pi text-[1.2rem]" [class]="icon()" aria-hidden="true"></i>
  </span>
  <div class="min-w-0 flex-1">
    <p class="m-0 truncate text-[0.875rem] font-semibold text-brand-text" [title]="nombre()">
      {{ nombre() }}
    </p>
    @if (meta()) {
      <p class="m-0 mt-0.5 truncate text-[0.72rem] text-brand-muted">{{ meta() }}</p>
    }
  </div>
  <ng-content />
</div>
