<lib-breadcrumb [items]="breadcrumbItems()" />

<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  libFocusInvalid
  autocomplete="off"
  class="flex flex-col gap-5"
>
  <!-- ── Barra de acciones ─────────────────────────────────────────────────── -->
  <lib-page-actions>
    <p-button
      type="button"
      [label]="t().common.actions.back"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      [label]="t().common.actions.save"
      size="small"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="isSaving()"
    />
  </lib-page-actions>

  <!-- ── Sección: Información general ──────────────────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-sync text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
          {{
            isEditMode()
              ? t().entities.facturaCompraRecurrente.form.editTitle
              : t().entities.facturaCompraRecurrente.form.createTitle
          }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">
          {{ t().entities.facturaCompraRecurrente.form.sectionHint }}
        </p>
      </div>
    </div>

    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
        <!-- Proveedor -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="contacto" class="factura-compra-recurrente-form__label">
            {{ t().entities.facturaCompraRecurrente.form.fields.proveedor }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-contacto-select
            inputId="contacto"
            formControlName="contacto"
            [extraParams]="contactoParams"
            [placeholder]="t().entities.facturaCompraRecurrente.form.fields.proveedorPlaceholder"
            [invalid]="form.controls.contacto.invalid && form.controls.contacto.touched"
          />
          <lib-field-error
            [control]="form.controls.contacto"
            [messages]="{ required: t().entities.facturaCompraRecurrente.form.validation.required }"
          />
        </div>

        <!-- Plazo de pago -->
        <div class="flex flex-col gap-1.5">
          <label for="plazo_pago" class="factura-compra-recurrente-form__label">
            {{ t().entities.facturaCompraRecurrente.form.fields.plazoPago }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-api-select
            inputId="plazo_pago"
            formControlName="plazo_pago"
            [endpoint]="plazoPagoEndpoint"
            [suggestedIndex]="0"
            [placeholder]="t().entities.facturaCompraRecurrente.form.fields.plazoPagoPlaceholder"
            [invalid]="form.controls.plazo_pago.invalid && form.controls.plazo_pago.touched"
          />
          <lib-field-error
            [control]="form.controls.plazo_pago"
            [messages]="{ required: t().entities.facturaCompraRecurrente.form.validation.required }"
          />
        </div>

        <!-- Forma de pago -->
        <div class="flex flex-col gap-1.5">
          <label for="forma_pago" class="factura-compra-recurrente-form__label">
            {{ t().entities.facturaCompraRecurrente.form.fields.formaPago }}
          </label>
          <lib-api-select
            inputId="forma_pago"
            formControlName="forma_pago"
            [suggestedIndex]="0"
            [endpoint]="formaPagoEndpoint"
            [placeholder]="t().entities.facturaCompraRecurrente.form.fields.formaPagoPlaceholder"
          />
        </div>

        <!-- Centro de costo + Sede (par compacto en la mitad izquierda) -->
        <div class="grid grid-cols-2 gap-x-3">
          <!-- Centro de costo -->
          <div class="flex flex-col gap-1.5">
            <label for="centro_costo" class="factura-compra-recurrente-form__label">
              {{ t().entities.facturaCompraRecurrente.form.fields.centroCosto }}
            </label>
            <lib-api-select
              inputId="centro_costo"
              formControlName="centro_costo"
              [endpoint]="centroCostoEndpoint"
              [suggestedIndex]="0"
              [placeholder]="
                t().entities.facturaCompraRecurrente.form.fields.centroCostoPlaceholder
              "
            />
          </div>

          <!-- Sede -->
          <div class="flex flex-col gap-1.5">
            <label for="sede" class="factura-compra-recurrente-form__label">
              {{ t().entities.facturaCompraRecurrente.form.fields.sede }}
            </label>
            <lib-api-select
              inputId="sede"
              formControlName="sede"
              [endpoint]="sedeEndpoint"
              [placeholder]="t().entities.facturaCompraRecurrente.form.fields.sedePlaceholder"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- Más información: los opcionales que menos se tocan (como en el ERP anterior). -->
    <app-mas-informacion [campos]="['orden_compra', 'comentario']">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
        <!-- Orden de compra -->
        <div class="flex flex-col gap-1.5">
          <label for="orden_compra" class="factura-compra-recurrente-form__label">
            {{ t().entities.facturaCompraRecurrente.form.fields.ordenCompra }}
          </label>
          <input
            id="orden_compra"
            pInputText
            formControlName="orden_compra"
            maxlength="50"
            class="w-full"
          />
        </div>

        <!-- Comentario -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="comentario" class="factura-compra-recurrente-form__label">
            {{ t().entities.facturaCompraRecurrente.form.fields.comentario }}
          </label>
          <textarea
            id="comentario"
            pTextarea
            formControlName="comentario"
            rows="3"
            maxlength="500"
            class="w-full"
          ></textarea>
        </div>
      </div>
    </app-mas-informacion>
  </section>

  <!-- Líneas: card propia; las tabs y la botonera de la tabla son su cabecera -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <p-tabs
      class="[&_.p-tablist-tab-list]:px-5 [&_.p-tabpanels]:p-0 max-[576px]:[&_.p-tablist-tab-list]:px-4"
      value="detalles"
    >
      <p-tablist>
        <p-tab value="detalles">{{ t().entities.comercialDetalle.title }}</p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="detalles">
          <app-comercial-documento-detalles
            #detallesTabla
            modo="compra"
            [detalles]="form.controls.detalles"
            [documentId]="documentId()"
            [contactoId]="form.controls.contacto.value?.id ?? null"
            (imported)="onImported()"
          />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </section>

  <!-- Resumen del documento: fuera de la card, flotando bajo ella -->
  @if (detallesTabla.hayLineas()) {
    <app-comercial-documento-resumen [resumen]="detallesTabla.resumen()" />
  }
</form>

<p-confirmdialog />
