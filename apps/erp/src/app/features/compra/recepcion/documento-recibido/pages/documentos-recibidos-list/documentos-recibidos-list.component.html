<!--
  Documentos recibidos (Compra › Recepción). Chrome estándar de <lib-list-shell>;
  en el slot [toolbar], los filtros en línea a la izquierda y Cargar archivo a la
  derecha. Cada filtro lleva su label encima; las fechas van en un ancho acotado
  y `fluid`, como pide el sistema. Lo aplicado con Filtrar se recuerda en localStorage.
-->
@let d = t().entities.documentoRecibido;

<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="d.name">
  <div toolbar class="flex flex-wrap items-end justify-between gap-3">
    <div class="flex flex-wrap items-end gap-2">
      <div class="flex w-full flex-col gap-1 sm:w-64">
        <label for="dr-busqueda" class="text-[0.8rem] font-medium text-brand-text">{{
          d.filtros.busqueda
        }}</label>
        <p-iconfield iconPosition="left" class="w-full">
          <p-inputicon styleClass="pi pi-search" />
          <input
            id="dr-busqueda"
            pInputText
            type="search"
            pSize="small"
            class="w-full"
            [placeholder]="d.filtros.buscar"
            [ngModel]="busquedaInput()"
            (ngModelChange)="busquedaInput.set($event)"
          />
        </p-iconfield>
      </div>

      <div class="flex w-40 flex-col gap-1">
        <label for="dr-tipo" class="text-[0.8rem] font-medium text-brand-text">{{
          d.filtros.tipo
        }}</label>
        <p-select
          inputId="dr-tipo"
          size="small"
          class="w-full"
          [options]="tipoOptions()"
          optionLabel="label"
          optionValue="value"
          [showClear]="true"
          [placeholder]="d.filtros.estadosRecepcion.todos"
          [ngModel]="tipo()"
          (ngModelChange)="tipo.set($event)"
          appendTo="body"
        />
      </div>

      <div class="flex w-32 flex-col gap-1">
        <label for="dr-recepcion" class="text-[0.8rem] font-medium text-brand-text">{{
          d.filtros.estadoRecepcion
        }}</label>
        <p-select
          inputId="dr-recepcion"
          size="small"
          class="w-full"
          [options]="estadoRecepcionOptions()"
          optionLabel="label"
          optionValue="value"
          [ngModel]="estadoRecepcion()"
          (ngModelChange)="estadoRecepcion.set($event)"
          appendTo="body"
        />
      </div>

      <div class="flex w-36 flex-col gap-1">
        <label for="dr-desde" class="text-[0.8rem] font-medium text-brand-text">{{
          d.filtros.desde
        }}</label>
        <p-datepicker
          inputId="dr-desde"
          size="small"
          [fluid]="true"
          [showIcon]="true"
          [maxDate]="hasta()"
          [ngModel]="desde()"
          (ngModelChange)="desde.set($event)"
          appendTo="body"
        />
      </div>
      <div class="flex w-36 flex-col gap-1">
        <label for="dr-hasta" class="text-[0.8rem] font-medium text-brand-text">{{
          d.filtros.hasta
        }}</label>
        <p-datepicker
          inputId="dr-hasta"
          size="small"
          [fluid]="true"
          [showIcon]="true"
          [minDate]="desde()"
          [ngModel]="hasta()"
          (ngModelChange)="hasta.set($event)"
          appendTo="body"
        />
      </div>

      <!-- Espaciador a la altura del label; el botón se estira hasta la de los inputs. -->
      <div class="flex flex-col gap-1 self-stretch">
        <span class="invisible text-[0.8rem] font-medium" aria-hidden="true">.</span>
        <p-button
          class="flex-1"
          styleClass="!h-full"
          size="small"
          icon="pi pi-filter"
          severity="secondary"
          [label]="d.filtros.filtrar"
          (onClick)="filtrar()"
        />
      </div>

      @if (hayFiltros()) {
        <div class="flex flex-col gap-1 self-stretch">
          <span class="invisible text-[0.8rem] font-medium" aria-hidden="true">.</span>
          <p-button
            class="flex-1"
            styleClass="!h-full"
            size="small"
            icon="pi pi-filter-slash"
            severity="secondary"
            [text]="true"
            [label]="d.filtros.limpiar"
            (onClick)="limpiar()"
          />
        </div>
      }

      @if (correo(); as id) {
        <span
          class="inline-flex h-8 items-center gap-1.5 rounded-full border border-[rgba(20,48,73,0.12)] bg-sky-50 pr-1 pl-3 text-[0.75rem] font-semibold text-sky-800"
        >
          <i class="pi pi-envelope text-[0.7rem]"></i>
          {{ d.filtros.delCorreo }} #{{ id }}
          <button
            type="button"
            class="inline-flex h-6 w-6 items-center justify-center rounded-full text-sky-700 transition-colors hover:bg-sky-100"
            [attr.aria-label]="d.filtros.quitarCorreo"
            (click)="quitarCorreo()"
          >
            <i class="pi pi-times text-[0.65rem]"></i>
          </button>
        </span>
      }
    </div>

    <p-button
      size="small"
      icon="pi pi-upload"
      [label]="d.cargar"
      (onClick)="cargaVisible.set(true)"
    />
  </div>

  <lib-data-table
    table
    [columns]="columns"
    [rowActions]="rowActions"
    [items]="items()"
    [totalCount]="totalCount()"
    [loading]="isLoading()"
    [pageSize]="pageSize()"
    [currentPage]="currentPage()"
    [sort]="sort()"
    emptyTitleKey="entities.documentoRecibido.empty.title"
    emptySubKey="entities.documentoRecibido.empty.sub"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (rowActionInvoked)="onRowAction($event)"
  />
</lib-list-shell>

<p-confirmDialog />

<app-registrar-evento-dialog
  [(visible)]="eventoVisible"
  [documento]="eventoDocumento()"
  [codigo]="eventoCodigo()"
  (registrado)="onEventoRegistrado($event)"
/>

<app-cargar-documento-dialog [(visible)]="cargaVisible" (cargado)="onCargado()" />
