<!--
  Documentos recibidos (Compra › Recepción). Chrome estándar de <lib-list-shell>;
  en el slot [toolbar], los filtros en línea a la izquierda y Cargar archivo a la
  derecha. Las fechas van en un ancho acotado y `fluid`, como pide el sistema.
-->
@let d = t().entities.documentoRecibido;

<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="d.name">
  <div toolbar class="flex flex-wrap items-end justify-between gap-3">
    <div class="flex flex-wrap items-end gap-2">
      <p-iconfield iconPosition="left" class="w-full sm:w-64">
        <p-inputicon styleClass="pi pi-search" />
        <input
          pInputText
          type="search"
          pSize="small"
          class="w-full"
          [placeholder]="d.filtros.buscar"
          [attr.aria-label]="d.filtros.buscar"
          [ngModel]="busquedaInput()"
          (ngModelChange)="busquedaInput.set($event)"
          (keydown.enter)="filtrar()"
        />
      </p-iconfield>

      <p-select
        size="small"
        class="w-40"
        [options]="tipoOptions()"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        [placeholder]="d.filtros.tipo"
        [ariaLabel]="d.filtros.tipo"
        [ngModel]="tipo()"
        (ngModelChange)="tipo.set($event)"
        appendTo="body"
      />

      <p-select
        size="small"
        class="w-32"
        [options]="estadoRecepcionOptions()"
        optionLabel="label"
        optionValue="value"
        [ariaLabel]="d.filtros.estadoRecepcion"
        [ngModel]="estadoRecepcion()"
        (ngModelChange)="estadoRecepcion.set($event)"
        appendTo="body"
      />

      <div class="w-36">
        <p-datepicker
          size="small"
          [fluid]="true"
          [showIcon]="true"
          [placeholder]="d.filtros.desde"
          [ariaLabel]="d.filtros.desde"
          [maxDate]="hasta()"
          [ngModel]="desde()"
          (ngModelChange)="desde.set($event)"
          appendTo="body"
        />
      </div>
      <div class="w-36">
        <p-datepicker
          size="small"
          [fluid]="true"
          [showIcon]="true"
          [placeholder]="d.filtros.hasta"
          [ariaLabel]="d.filtros.hasta"
          [minDate]="desde()"
          [ngModel]="hasta()"
          (ngModelChange)="hasta.set($event)"
          appendTo="body"
        />
      </div>

      <!-- Se estira a la altura de la fila para igualar a los inputs. -->
      <p-button
        class="self-stretch"
        styleClass="!h-full"
        size="small"
        icon="pi pi-filter"
        severity="secondary"
        [label]="d.filtros.filtrar"
        (onClick)="filtrar()"
      />

      @if (correo(); as id) {
        <span
          class="inline-flex h-8 items-center gap-1.5 rounded-full border border-[rgba(20,48,73,0.12)] bg-sky-50 pr-1 pl-3 text-[0.75rem] font-semibold text-sky-800"
        >
          <i class="pi pi-envelope text-[0.7rem]"></i>
          {{ d.filtros.delCorreo }} #{{ id }}
          <button
            type="button"
            class="inline-flex h-6 w-6 items-center justify-center rounded-full text-sky-700 transition-colors hover:bg-sky-100"
            [attr.aria-label]="d.filtros.quitarCorreo"
            (click)="quitarCorreo()"
          >
            <i class="pi pi-times text-[0.65rem]"></i>
          </button>
        </span>
      }
    </div>

    <p-button
      size="small"
      icon="pi pi-upload"
      [label]="d.cargar"
      (onClick)="cargaVisible.set(true)"
    />
  </div>

  <lib-data-table
    table
    [columns]="columns"
    [rowActions]="rowActions"
    [items]="items()"
    [totalCount]="totalCount()"
    [loading]="isLoading()"
    [pageSize]="pageSize()"
    [currentPage]="currentPage()"
    [sort]="sort()"
    emptyTitleKey="entities.documentoRecibido.empty.title"
    emptySubKey="entities.documentoRecibido.empty.sub"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (rowActionInvoked)="onRowAction($event)"
  />
</lib-list-shell>

<p-confirmDialog />

<app-registrar-evento-dialog
  [(visible)]="eventoVisible"
  [documento]="eventoDocumento()"
  [codigo]="eventoCodigo()"
  (registrado)="onEventoRegistrado($event)"
/>

<app-cargar-documento-dialog [(visible)]="cargaVisible" (cargado)="onCargado()" />
