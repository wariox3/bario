<!--
  Solo el marco: el rótulo del grupo lo pone la ficha, que es quien conoce el
  idioma de sus columnas.

  El marco es cuadrado y no apaisado: la mayoría de los logotipos traen aire
  arriba y abajo, y en una franja baja quedaban flotando en una raya. El alto
  además empareja esta columna con las dos de datos que tiene al lado.

  El recorte también es cuadrado (1:1, el default del componente): lo que se
  guarda tiene la misma forma que el marco donde se muestra. Un logotipo apaisado
  hay que encuadrarlo al subirlo.
-->
@if (loading()) {
  <div class="size-40 animate-pulse rounded-xl bg-[rgba(20,48,73,0.06)]"></div>
} @else {
  <app-erp-image-upload
    [imageUrl]="imageUrl()"
    [alt]="t().empresa.logo.alt"
    [disabled]="isSaving()"
    format="png"
    fit="contain"
    accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
    [hint]="t().empresa.logo.formats"
    width="10rem"
    height="10rem"
    (imageSelected)="onImageSelected($event)"
    (imageRemoved)="onImageRemoved()"
  />
}
