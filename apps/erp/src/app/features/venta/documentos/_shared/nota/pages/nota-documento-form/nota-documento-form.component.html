@let f = t().entities.notaVenta.form;

<lib-breadcrumb [items]="breadcrumbItems()" />

<form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off" class="flex flex-col gap-5">
  <!-- ── Encabezado de página ──────────────────────────────────────────────── -->
  <header class="flex items-center gap-2">
    <p-button
      type="button"
      [label]="t().common.actions.back"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      [label]="t().common.actions.save"
      size="small"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="form.invalid || form.pending || isSaving()"
    />
  </header>

  <!-- ── Sección: Información general ──────────────────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-file-edit text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
        <!-- El título es el nombre del documento activo (Nota crédito, Nota débito):
             la página la comparte la familia, así que no puede venir de un literal. -->
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
          {{ documentName() }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">
          {{ isEditMode() ? f.editHint : f.createHint }}
        </p>
      </div>
    </div>

    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
        <!-- Cliente -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="contacto" class="nota-documento-form__label">
            {{ f.fields.cliente }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-contacto-select
            inputId="contacto"
            formControlName="contacto"
            [extraParams]="contactoParams"
            [placeholder]="f.fields.clientePlaceholder"
            [invalid]="form.controls.contacto.invalid && form.controls.contacto.touched"
          />
          <lib-field-error
            [control]="form.controls.contacto"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Fecha -->
        <div class="flex flex-col gap-1.5">
          <label for="fecha" class="nota-documento-form__label">
            {{ f.fields.fecha }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <p-datepicker
            inputId="fecha"
            formControlName="fecha"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            appendTo="body"
            [fluid]="true"
            [invalid]="form.controls.fecha.invalid && form.controls.fecha.touched"
          />
          <lib-field-error
            [control]="form.controls.fecha"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Documento de referencia (factura de venta aprobada del cliente) -->
        <!-- TODO(nota-venta): select deshabilitado hasta confirmar el contrato del
             backend del endpoint de referencia. Ver el TODO en
             nota-documento-form.component.ts (referenciaParams/referenciaEndpoint).
             Al reactivar, descomentar este bloque. -->
        <div class="flex flex-col gap-1.5">
          <!-- <label for="documento_referencia" class="nota-documento-form__label">
            {{ f.fields.documentoReferencia }}
          </label>
          <lib-api-select
            inputId="documento_referencia"
            formControlName="documento_referencia"
            [endpoint]="referenciaEndpoint"
            [params]="referenciaParams()"
            [displayWith]="referenciaLabel"
            [placeholder]="
              form.controls.contacto.value
                ? f.fields.documentoReferenciaPlaceholder
                : f.fields.documentoReferenciaDisabled
            "
          /> -->
        </div>

        <!-- Sede -->
        <div class="flex flex-col gap-1.5">
          <label for="sede" class="nota-documento-form__label">{{ f.fields.sede }}</label>
          <lib-api-select
            inputId="sede"
            formControlName="sede"
            [endpoint]="sedeEndpoint"
            [placeholder]="f.fields.sedePlaceholder"
          />
        </div>

        <!-- Método de pago -->
        <div class="flex flex-col gap-1.5">
          <label for="metodo_pago" class="nota-documento-form__label">
            {{ f.fields.metodoPago }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-api-select
            inputId="metodo_pago"
            formControlName="metodo_pago"
            [endpoint]="metodoPagoEndpoint"
            [placeholder]="f.fields.metodoPagoPlaceholder"
            [invalid]="form.controls.metodo_pago.invalid && form.controls.metodo_pago.touched"
          />
          <lib-field-error
            [control]="form.controls.metodo_pago"
            [messages]="{ required: f.validation.required }"
          />
        </div>
      </div>
    </div>
  </section>

  <!-- ── Sección: Líneas, pagos e información ──────────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <p-tabs [value]="activeTab()" (valueChange)="activeTab.set($any($event))">
        <p-tablist>
          <p-tab value="detalles">{{ f.tabs.detalles }}</p-tab>
          <p-tab value="pagos">
            {{ f.tabs.pagos }}
            <!-- Los pagos quedan tras un clic, pero conviene saber si están en orden
                 desde otra pestaña: el chip lleva el conteo y se tiñe si exceden. -->
            @if (pagos.length > 0) {
              <span
                class="ml-2 inline-block rounded-md px-2 py-0.5 font-mono text-[0.75rem] font-semibold tabular-nums"
                [class]="
                  pagosExceden()
                    ? 'bg-red-50 text-red-600'
                    : 'bg-[rgba(20,48,73,0.06)] text-brand-text'
                "
              >
                {{ pagos.length }}
              </span>
            }
          </p-tab>
          <p-tab value="informacion">{{ f.tabs.informacion }}</p-tab>
        </p-tablist>

        <p-tabpanels>
          <p-tabpanel value="detalles">
            <app-comercial-documento-detalles
              [detalles]="form.controls.detalles"
              [documentId]="documentId()"
              [contactoId]="form.controls.contacto.value?.id ?? null"
              (imported)="onImported()"
            />
          </p-tabpanel>

          <p-tabpanel value="pagos">
            <app-documento-pagos [pagos]="form.controls.pagos" [documentTotal]="totalGeneral()" />
          </p-tabpanel>

          <p-tabpanel value="informacion">
            <!-- Comentario -->
            <div class="flex flex-col gap-1.5">
              <label for="comentario" class="nota-documento-form__label">
                {{ f.fields.comentario }}
              </label>
              <textarea
                pTextarea
                id="comentario"
                formControlName="comentario"
                rows="4"
                [fluid]="true"
                [placeholder]="f.fields.comentarioPlaceholder"
                [invalid]="form.controls.comentario.invalid && form.controls.comentario.touched"
              ></textarea>
              <lib-field-error
                [control]="form.controls.comentario"
                [messages]="{ maxlength: f.validation.comentarioMax }"
              />
            </div>
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>
  </section>
</form>

<p-confirmdialog />
