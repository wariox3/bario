<lib-breadcrumb [items]="breadcrumbItems()" />

<form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off" class="flex flex-col gap-5">
  <!-- ── Barra de acciones ─────────────────────────────────────────────────── -->
  <lib-page-actions>
    <p-button
      type="button"
      [label]="t().common.actions.back"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      [label]="t().common.actions.save"
      size="small"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="form.invalid || form.pending || isSaving()"
    />
  </lib-page-actions>

  <!-- ── Sección: Información general ──────────────────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-file-edit text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
          {{
            isEditMode()
              ? t().entities.remision.form.editTitle
              : t().entities.remision.form.createTitle
          }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">
          {{ t().entities.remision.form.sectionHint }}
        </p>
      </div>
    </div>

    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
        <!-- Cliente -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="contacto" class="remision-form__label">
            {{ t().entities.remision.form.fields.cliente }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-contacto-select
            inputId="contacto"
            formControlName="contacto"
            [extraParams]="contactoParams"
            [placeholder]="t().entities.remision.form.fields.clientePlaceholder"
            [invalid]="form.controls.contacto.invalid && form.controls.contacto.touched"
          />
          <lib-field-error
            [control]="form.controls.contacto"
            [messages]="{ required: t().entities.remision.form.validation.required }"
          />
        </div>

        <!-- Fecha -->
        <div class="flex flex-col gap-1.5">
          <label for="fecha" class="remision-form__label">
            {{ t().entities.remision.form.fields.fecha }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <p-datepicker
            inputId="fecha"
            formControlName="fecha"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            appendTo="body"
            [fluid]="true"
            [invalid]="form.controls.fecha.invalid && form.controls.fecha.touched"
          />
          <lib-field-error
            [control]="form.controls.fecha"
            [messages]="{ required: t().entities.remision.form.validation.required }"
          />
        </div>

        <!-- Sede -->
        <div class="flex flex-col gap-1.5">
          <label for="sede" class="remision-form__label">
            {{ t().entities.remision.form.fields.sede }}
          </label>
          <lib-api-select
            inputId="sede"
            formControlName="sede"
            [endpoint]="sedeEndpoint"
            [placeholder]="t().entities.remision.form.fields.sedePlaceholder"
          />
        </div>

        <!-- Asesor -->
        <div class="flex flex-col gap-1.5">
          <label for="asesor" class="remision-form__label">
            {{ t().entities.remision.form.fields.asesor }}
          </label>
          <lib-asesor-select
            inputId="asesor"
            formControlName="asesor"
            [placeholder]="t().entities.remision.form.fields.asesorPlaceholder"
          />
        </div>

        <!-- Comentario -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="comentario" class="remision-form__label">
            {{ t().entities.remision.form.fields.comentario }}
          </label>
          <textarea
            pTextarea
            id="comentario"
            formControlName="comentario"
            rows="3"
            [fluid]="true"
            [placeholder]="t().entities.remision.form.fields.comentarioPlaceholder"
            [invalid]="form.controls.comentario.invalid && form.controls.comentario.touched"
          ></textarea>
          <lib-field-error
            [control]="form.controls.comentario"
            [messages]="{ maxlength: t().entities.remision.form.validation.comentarioMax }"
          />
        </div>
      </div>
    </div>
  </section>

  <!-- ── Sección: Detalles (líneas comerciales) ───────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-list text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
          {{ t().entities.comercialDetalle.title }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">
          {{ t().entities.comercialDetalle.hint }}
        </p>
      </div>
    </div>

    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <app-comercial-documento-detalles
        [detalles]="form.controls.detalles"
        [documentId]="documentId()"
        [importEnabled]="true"
        [contactoId]="form.controls.contacto.value?.id ?? null"
        (imported)="onImported()"
      />
    </div>
  </section>
</form>

<p-confirmdialog />
