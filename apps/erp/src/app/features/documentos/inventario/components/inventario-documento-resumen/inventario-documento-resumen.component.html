@let r = t().entities.inventarioDetalle.resumen;

<div class="flex justify-end">
  <div
    class="w-72 rounded-lg border border-[rgba(20,48,73,0.1)] bg-brand-surface px-4 py-3 shadow-sm"
  >
    <div class="flex flex-col gap-1.5">
      <div class="flex items-baseline justify-between gap-2 text-[0.74rem]">
        <span class="text-brand-muted">{{ r.cantidad }}</span>
        <span class="tabular-nums text-brand-text">{{ resumen().cantidad }}</span>
      </div>
      <div class="flex items-baseline justify-between gap-2 text-[0.74rem]">
        <span class="text-brand-muted">{{ r.subtotal }}</span>
        <span class="tabular-nums text-brand-text">{{ formatMoney(resumen().subtotal) }}</span>
      </div>
      <div
        class="mt-1 flex items-baseline justify-between gap-2 border-t border-[rgba(20,48,73,0.1)] pt-2.5"
      >
        <span class="text-[0.78rem] font-semibold text-brand-text">{{ r.total }}</span>
        <span
          class="text-[1.35rem] font-bold leading-none tracking-[-0.02em] tabular-nums text-[#143049]"
        >
          {{ formatMoney(resumen().total) }}
        </span>
      </div>
    </div>
  </div>
</div>
