@let p = t().entities.documentoPago;

<div class="flex flex-col gap-4">
  <!-- Toolbar: mismo idioma que la tabla de detalles (acción a la derecha) -->
  <div class="flex items-center justify-end gap-2">
    <p class="m-0 mr-auto text-[0.75rem] text-brand-muted">{{ hint() ?? p.hint }}</p>
    <p-button
      type="button"
      size="small"
      icon="pi pi-plus"
      [label]="p.add"
      [outlined]="true"
      (onClick)="addPago()"
    />
  </div>

  <div class="max-h-[30rem] overflow-auto rounded-xl border border-[rgba(20,48,73,0.12)]">
    <table class="documento-pagos-table">
      <thead>
        <tr>
          <th class="documento-pagos-table__th w-10 text-center">{{ p.columns.linea }}</th>
          <th class="documento-pagos-table__th min-w-[16rem] text-left">
            {{ p.columns.cuentaBanco }}
          </th>
          <th class="documento-pagos-table__th w-48 text-right">{{ p.columns.monto }}</th>
          <th class="documento-pagos-table__th w-20 text-center">{{ p.columns.acciones }}</th>
        </tr>
      </thead>
      <tbody>
        @for (pago of pagos().controls; track pago; let i = $index) {
          <tr [formGroup]="pago" class="documento-pagos-table__row">
            <td class="documento-pagos-table__td text-center text-brand-muted tabular-nums">
              {{ i + 1 }}
            </td>

            <td class="documento-pagos-table__td">
              <lib-api-select
                formControlName="cuenta_banco"
                [endpoint]="cuentaBancoEndpoint"
                [placeholder]="p.cuentaBancoPlaceholder"
                [invalid]="pago.controls.cuenta_banco.invalid && pago.controls.cuenta_banco.touched"
              />
            </td>

            <td class="documento-pagos-table__td">
              <p-inputnumber
                formControlName="pago"
                [invalid]="pago.controls.pago.invalid && pago.controls.pago.touched"
                mode="decimal"
                [min]="0"
                [minFractionDigits]="0"
                [maxFractionDigits]="2"
                prefix="$ "
                [fluid]="true"
                inputStyleClass="text-right"
              />
            </td>

            <td class="documento-pagos-table__td">
              <div class="flex items-center justify-center">
                <button
                  type="button"
                  (click)="removePago(i)"
                  [pTooltip]="p.removePago"
                  [attr.aria-label]="p.removePago"
                  class="flex h-6 w-6 cursor-pointer items-center justify-center rounded-md border-0 bg-transparent text-brand-muted transition-colors hover:bg-red-50 hover:text-red-600"
                >
                  <i class="pi pi-trash text-[0.72rem]"></i>
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="px-5 py-8 text-center text-sm text-brand-muted">
              <i class="pi pi-inbox mr-2"></i>{{ p.empty }}
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
