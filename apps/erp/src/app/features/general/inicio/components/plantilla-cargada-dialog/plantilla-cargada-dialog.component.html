@let res = t().inicio.general.datosIniciales.resultado;

<p-dialog
  [visible]="visible()"
  (visibleChange)="!$event && onHide()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="false"
  [dismissableMask]="false"
  [style]="{ width: '440px', maxWidth: '94vw' }"
  styleClass="erp-plantilla-dialog"
>
  <!--
    Cabecera. Las mismas tres capas de la tira de invitación, a la misma
    opacidad de susurro: la marca entra como luz, no como campo de color. Se
    probó con la banda en navy sólido y pesaba de más — un bloque de color es
    exactamente lo que el sistema evita, y para un acuse no hace falta gritar.

    La atmósfera se disuelve hacia abajo (máscara vertical) en vez de cortarse
    con un borde: el recibo emerge del degradado sin que nada lo separe.
  -->
  <div class="relative overflow-hidden px-6 pt-8 pb-6 text-center">
    <div
      aria-hidden="true"
      class="pointer-events-none absolute inset-0 bg-[radial-gradient(circle,rgba(20,48,73,0.14)_1px,transparent_1.6px)] bg-[size:14px_14px] [mask-image:linear-gradient(to_bottom,rgba(0,0,0,0.85),transparent_88%)]"
    ></div>
    <div
      aria-hidden="true"
      class="pointer-events-none absolute -top-28 left-1/2 h-64 w-80 -translate-x-1/2 rounded-full bg-[radial-gradient(closest-side,rgba(119,170,215,0.28),transparent)]"
    ></div>

    <div class="relative flex flex-col items-center">
      <!--
        El mismo chip sky de la tira, escalado: es la firma visual de "algo
        disponible para tu empresa" en los inicios, y acá cierra ese arco.
      -->
      <span
        class="flex h-12 w-12 items-center justify-center rounded-[14px] bg-sky-50 text-sky-700 ring-1 ring-[rgba(20,48,73,0.06)]"
      >
        <i class="pi pi-check text-[1.2rem]" aria-hidden="true"></i>
      </span>

      <h2 class="m-0 mt-4 text-[1.1rem] font-extrabold tracking-[-0.03em] text-brand-navy">
        {{ res.title }}
      </h2>
      <p class="m-0 mt-1.5 max-w-[22rem] text-[0.8rem] leading-relaxed text-brand-muted">
        {{ res.desc }}
      </p>
    </div>
  </div>

  <!--
    El recibo. Nombre a la izquierda, guía punteada que estira, cantidad a la
    derecha en monoespaciada tabular: las cifras quedan en columna aunque tengan
    distinto ancho, que es lo que hace que se puedan comparar de un vistazo.
    Cada línea entra escalonada — el recibo se escribe solo.
  -->
  <div class="max-h-[42vh] overflow-y-auto px-6 pt-1">
    @for (linea of lineas(); track linea.clave; let i = $index) {
      <div
        class="linea flex items-baseline gap-2 py-[0.3rem]"
        [style.animation-delay.ms]="80 + i * 45"
      >
        <span class="shrink-0 text-[0.82rem] text-brand-text">{{ linea.nombre }}</span>
        <span
          aria-hidden="true"
          class="min-w-4 flex-1 translate-y-[-0.15rem] border-b border-dotted border-[rgba(20,48,73,0.25)]"
        ></span>
        <span class="shrink-0 font-mono text-[0.85rem] font-semibold tabular-nums text-brand-text">
          {{ linea.cantidad }}
        </span>
      </div>
    }
  </div>

  <!--
    La suma, tras un filete más marcado: quien usa un ERP baja el ojo buscando
    el total, así que va al pie del recibo y no en el encabezado.
  -->
  <div class="mx-6 mt-3 border-t-2 border-[rgba(20,48,73,0.12)] pt-3">
    <div class="flex items-baseline gap-2">
      <span class="flex-1 text-[0.82rem] font-semibold text-brand-navy">{{ res.totalLabel }}</span>
      <span class="font-mono text-[1.05rem] font-bold tabular-nums text-brand-navy">
        {{ total() }}
      </span>
    </div>
  </div>

  <div class="flex justify-end px-6 pt-5 pb-6">
    <p-button type="button" size="small" [label]="res.actions.cerrar" (onClick)="onHide()" />
  </div>
</p-dialog>
