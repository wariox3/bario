<!--
  Asistente de datos iniciales. Misma tira que la invitación de Venta
  (`app-inicio-invitacion`); lo único propio es que acá hay dos salidas, no una:
  omitir viaja como texto secundario para que la que ofrecemos siga siendo una.
-->
@if (mostrarAsistente()) {
  <app-inicio-invitacion
    icon="pi-bolt"
    [title]="t().inicio.general.datosIniciales.title"
    [desc]="t().inicio.general.datosIniciales.desc"
  >
    <p-button
      type="button"
      size="small"
      [text]="true"
      severity="secondary"
      [label]="t().inicio.general.datosIniciales.actions.omitir"
      [loading]="enVuelo() === 'descartar'"
      [disabled]="enVuelo() === 'cargar'"
      (onClick)="onOmitir()"
    />
    <p-button
      type="button"
      size="small"
      icon="pi pi-arrow-right"
      iconPos="right"
      [label]="t().inicio.general.datosIniciales.actions.cargar"
      [loading]="enVuelo() === 'cargar'"
      [disabled]="enVuelo() === 'descartar'"
      (onClick)="onCargar()"
    />
  </app-inicio-invitacion>
}

<h1 class="m-0 text-[1.1rem] font-bold tracking-tight text-brand-text">
  {{ t().inicio.general.titulo }}
</h1>

<!-- En lg la fila de fichas deja dos huecos a propósito: ahí va lo que se sume. -->
<div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
  <app-cartera-resumen tipo="cobrar" />
  <app-cartera-resumen tipo="pagar" />
  <app-resultado-resumen />
</div>

<!-- El acuse de la siembra: se abre solo cuando hay resultado. -->
<app-plantilla-cargada-dialog [resultado]="resultado()" (cerrar)="onCerrarResultado()" />
