@let h = t().facturacionElectronica.habilitaciones;

@if (loading()) {
  <div class="grid gap-5 lg:grid-cols-2">
    @for (tarjeta of tarjetas(); track tarjeta.tipo) {
      <div class="h-56 animate-pulse rounded-xl bg-[rgba(20,48,73,0.06)]"></div>
    }
  </div>
} @else if (consultaError(); as mensaje) {
  <div class="rounded-xl border border-red-200 bg-brand-surface px-5 py-4">
    <app-estado-error
      [mensaje]="mensaje"
      [reintentarLabel]="h.reintentar"
      (reintentar)="consultar()"
    />
  </div>
} @else {
  <div class="grid gap-5 lg:grid-cols-2">
    @for (tarjeta of tarjetas(); track tarjeta.tipo) {
      <app-software-card
        [tipo]="tarjeta.tipo"
        [software]="tarjeta.software"
        (configurar)="abrirCrear($event)"
        (actualizar)="abrirActualizar($event)"
      />
    }
  </div>

  <!--
    «Continuar» espera a que al menos un tipo tenga su software. Deshabilitado
    pero no mudo: la línea de al lado dice qué falta.
  -->
  <div class="mt-5 flex flex-wrap items-center justify-end gap-3 pb-1">
    @if (!algunoConfigurado()) {
      <p class="m-0 text-[0.75rem] text-brand-muted">{{ h.continuarPendiente }}</p>
    }
    <p-button
      type="button"
      icon="pi pi-arrow-right"
      iconPos="right"
      [label]="t().facturacionElectronica.asistente.actions.continuar"
      [disabled]="!algunoConfigurado()"
      (onClick)="avanzar.emit()"
    />
  </div>
}

<app-software-dialog
  [(visible)]="dialogVisible"
  [tipo]="tipoEnModal()"
  [software]="softwareEnModal()"
  (guardado)="consultar()"
/>
