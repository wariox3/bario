<!--
  Seguridad del contenedor.
  Mismo chrome que <lib-list-shell> / la utilidad "Enviar factura electrónica":
  card con header de título + cuerpo con la tabla embebida en su propio recuadro.
  Sin breadcrumb porque no cuelga de ningún módulo (se entra por el user-menu,
  igual que Configuración). Depth borders-only, navy, radios 12px.
-->
<section
  class="flex min-h-0 flex-1 flex-col overflow-hidden rounded-xl border border-[rgba(19,38,60,0.08)] bg-white shadow-[0_1px_2px_rgba(19,38,60,0.04)]"
>
  <header class="min-w-0 border-b border-[rgba(19,38,60,0.08)] px-4 py-[0.85rem]">
    <h1 class="m-0 text-[1.125rem] font-bold tracking-[-0.02em] text-brand-navy">
      {{ t().seguridad.title }}
    </h1>
    <p class="m-0 mt-[0.15rem] text-[0.8rem] text-brand-muted">{{ t().seguridad.subtitle }}</p>
  </header>

  <div class="flex min-h-0 flex-1 flex-col px-4 pt-2 pb-4">
    <p-tabs
      [value]="activeSeccion()"
      (valueChange)="onTabChange($any($event))"
      class="seguridad-tabs"
    >
      <p-tablist>
        <p-tab value="usuarios">{{ t().seguridad.tabs.usuarios }}</p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="usuarios">
          <app-usuarios-list />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </div>
</section>
