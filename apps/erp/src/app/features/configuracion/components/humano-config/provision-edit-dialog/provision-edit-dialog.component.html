@let m = t().configuracion.humano.provision;

<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!isSaving()"
  [dismissableMask]="!isSaving()"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '768px': '95vw' }"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-pencil text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[1.02rem] font-bold leading-tight tracking-tight text-brand-text">
          {{ m.dialog.title }}
        </h2>
        <p class="m-0 truncate text-[0.75rem] text-brand-muted">
          {{ provision()?.tipo_label }} · {{ provision()?.tipo_costo_nombre }}
        </p>
      </div>
    </div>
  </ng-template>

  @if (visible()) {
    <form [formGroup]="form" class="flex flex-col gap-4 pt-1" (ngSubmit)="onSubmit()">
      <div class="flex flex-col gap-1.5">
        <label for="cuenta_debito" class="text-[0.8rem] font-medium text-brand-text">
          {{ m.fields.cuentaDebito }}
        </label>
        <app-cuenta-select inputId="cuenta_debito" formControlName="cuenta_debito" />
        <p class="m-0 text-[0.75rem] text-brand-muted">{{ m.fields.cuentaDebitoHint }}</p>
      </div>

      @if (llevaCredito()) {
        <div class="flex flex-col gap-1.5">
          <label for="cuenta_credito" class="text-[0.8rem] font-medium text-brand-text">
            {{ m.fields.cuentaCredito }}
          </label>
          <app-cuenta-select inputId="cuenta_credito" formControlName="cuenta_credito" />
          <p class="m-0 text-[0.75rem] text-brand-muted">{{ m.fields.cuentaCreditoHint }}</p>
        </div>
      } @else {
        <p class="m-0 text-[0.75rem] text-brand-muted">{{ m.fields.sinCredito }}</p>
      }
    </form>
  }

  <ng-template pTemplate="footer">
    <p-button
      severity="secondary"
      [text]="true"
      [label]="t().common.actions.cancel"
      [disabled]="isSaving()"
      (onClick)="visible.set(false)"
    />
    <p-button
      [label]="t().configuracion.actions.save"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="isSaving()"
      (onClick)="onSubmit()"
    />
  </ng-template>
</p-dialog>
