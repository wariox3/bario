@let m = t().configuracion.humano.aporte;

<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!isSaving()"
  [dismissableMask]="!isSaving()"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '768px': '95vw' }"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-pencil text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[1.02rem] font-bold leading-tight tracking-tight text-brand-text">
          {{ m.dialog.title }}
        </h2>
        <p class="m-0 truncate text-[0.75rem] text-brand-muted">{{ aporte()?.tipo_label }}</p>
      </div>
    </div>
  </ng-template>

  @if (visible()) {
    <form [formGroup]="form" class="flex flex-col gap-1.5 pt-1" (ngSubmit)="onSubmit()">
      <label for="cuenta" class="text-[0.8rem] font-medium text-brand-text">
        {{ m.fields.cuenta }}
      </label>
      <app-cuenta-select inputId="cuenta" formControlName="cuenta" />
      <p class="m-0 text-[0.75rem] text-brand-muted">{{ m.fields.cuentaHint }}</p>
    </form>
  }

  <ng-template pTemplate="footer">
    <p-button
      severity="secondary"
      [text]="true"
      [label]="t().common.actions.cancel"
      [disabled]="isSaving()"
      (onClick)="visible.set(false)"
    />
    <p-button
      [label]="t().configuracion.actions.save"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="isSaving()"
      (onClick)="onSubmit()"
    />
  </ng-template>
</p-dialog>
