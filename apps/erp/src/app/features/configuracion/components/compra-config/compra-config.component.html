@let c = t().configuracion.compra;

@if (loading()) {
  <div class="h-52 animate-pulse rounded-xl bg-[rgba(20,48,73,0.06)]"></div>
} @else if (loadFailed()) {
  <div
    class="flex flex-col items-center justify-center gap-3 rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface py-16 text-center"
  >
    <i class="pi pi-exclamation-triangle text-xl text-brand-muted"></i>
    <p class="m-0 text-sm text-brand-muted">{{ t().configuracion.toasts.loadError.desc }}</p>
    <p-button
      type="button"
      [label]="t().common.actions.refresh"
      icon="pi pi-refresh"
      [outlined]="true"
      severity="secondary"
      (onClick)="cargar()"
    />
  </div>
} @else {
  <form [formGroup]="form" (ngSubmit)="onSave()" libFocusInvalid class="flex flex-col gap-5">
    <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
      <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
        >
          <i class="pi pi-inbox text-[1.05rem]"></i>
        </span>
        <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
          <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
            {{ c.recibe.title }}
          </h2>
          <p class="m-0 text-[0.75rem] text-brand-muted">{{ c.recibe.hint }}</p>
        </div>
      </div>

      <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
        <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
          <!-- Documento: tipo + número en una fila, como en Mi empresa -->
          <div class="flex flex-col gap-1.5 sm:col-span-2">
            <label
              for="recibe-numero"
              class="text-[0.78rem] font-semibold tracking-[-0.01em] text-brand-text"
            >
              {{ c.fields.documento }}
              <span class="ml-px text-red-500">*</span>
            </label>
            <div class="flex gap-2">
              <div class="w-60 shrink-0">
                <lib-api-select
                  inputId="recibe-identificacion"
                  formControlName="identificacion"
                  [endpoint]="endpoints.identificacion"
                  [ariaLabel]="c.fields.identificacion"
                  [invalid]="
                    form.controls.identificacion.invalid && form.controls.identificacion.touched
                  "
                />
              </div>
              <input
                pInputText
                id="recibe-numero"
                formControlName="numero_identificacion"
                inputmode="numeric"
                class="min-w-0 flex-1"
                fluid
                [attr.aria-label]="c.fields.numeroIdentificacion"
                [invalid]="
                  form.controls.numero_identificacion.invalid &&
                  form.controls.numero_identificacion.touched
                "
              />
            </div>
            <lib-field-error
              [control]="form.controls.identificacion"
              [messages]="{ required: c.validation.required }"
            />
            <lib-field-error
              [control]="form.controls.numero_identificacion"
              [messages]="{ required: c.validation.required, maxlength: c.validation.maxLength }"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              for="recibe-nombres"
              class="text-[0.78rem] font-semibold tracking-[-0.01em] text-brand-text"
            >
              {{ c.fields.nombres }}
              <span class="ml-px text-red-500">*</span>
            </label>
            <input
              pInputText
              id="recibe-nombres"
              formControlName="nombres"
              fluid
              [invalid]="form.controls.nombres.invalid && form.controls.nombres.touched"
            />
            <lib-field-error
              [control]="form.controls.nombres"
              [messages]="{ required: c.validation.required, maxlength: c.validation.maxLength }"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              for="recibe-apellidos"
              class="text-[0.78rem] font-semibold tracking-[-0.01em] text-brand-text"
            >
              {{ c.fields.apellidos }}
              <span class="ml-px text-red-500">*</span>
            </label>
            <input
              pInputText
              id="recibe-apellidos"
              formControlName="apellidos"
              fluid
              [invalid]="form.controls.apellidos.invalid && form.controls.apellidos.touched"
            />
            <lib-field-error
              [control]="form.controls.apellidos"
              [messages]="{ required: c.validation.required, maxlength: c.validation.maxLength }"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              for="recibe-cargo"
              class="text-[0.78rem] font-semibold tracking-[-0.01em] text-brand-text"
            >
              {{ c.fields.cargo }}
            </label>
            <input pInputText id="recibe-cargo" formControlName="cargo" fluid />
            <lib-field-error
              [control]="form.controls.cargo"
              [messages]="{ maxlength: c.validation.maxLength }"
            />
          </div>

          <div class="flex flex-col gap-1.5">
            <label
              for="recibe-area"
              class="text-[0.78rem] font-semibold tracking-[-0.01em] text-brand-text"
            >
              {{ c.fields.area }}
            </label>
            <input pInputText id="recibe-area" formControlName="area" fluid />
            <lib-field-error
              [control]="form.controls.area"
              [messages]="{ maxlength: c.validation.maxLength }"
            />
          </div>
        </div>
      </div>
    </section>

    <div class="flex items-center justify-end gap-3 pb-1">
      @if (form.dirty) {
        <span class="inline-flex items-center gap-1.5 text-[0.78rem] text-brand-muted">
          <span class="h-1.5 w-1.5 rounded-full bg-amber-500"></span>
          {{ t().configuracion.unsavedChanges }}
        </span>
      }
      <p-button
        type="submit"
        [label]="t().configuracion.actions.save"
        icon="pi pi-check"
        [loading]="isSaving()"
        [disabled]="isSaving()"
      />
    </div>
  </form>
}
