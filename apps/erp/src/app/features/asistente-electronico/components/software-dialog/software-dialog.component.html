@let h = t().asistenteElectronico.habilitaciones;

<!--
  `appendTo="body"`: el paso vive dentro de un contenedor animado con
  `transform`, que encierra a todo `position: fixed`; sin esto la máscara
  queda del tamaño del paso y no de la pantalla.
-->
<p-dialog
  appendTo="body"
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!guardando()"
  [dismissableMask]="!guardando()"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '768px': '95vw' }"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-key text-[1.05rem]" aria-hidden="true"></i>
      </span>
      <div class="flex flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[1.02rem] leading-tight font-bold tracking-tight text-brand-text">
          {{ software() ? h.actualizar.title : h.crear.title }}
        </h2>
        @if (tipo(); as tipo) {
          <p class="m-0 text-[0.75rem] text-brand-muted">{{ h.tipos[tipo].title }}</p>
        }
      </div>
    </div>
  </ng-template>

  @if (visible()) {
    <form
      [formGroup]="form"
      libFocusInvalid
      class="flex flex-col gap-4 pt-1"
      (ngSubmit)="onSubmit()"
    >
      <p class="m-0 text-[0.78rem] leading-relaxed text-brand-muted">{{ h.crear.desc }}</p>

      <div class="flex flex-col gap-1.5">
        <label for="software-identificador" class="text-[0.8rem] font-medium text-brand-text">
          {{ h.campos.identificador }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <input
          id="software-identificador"
          pInputText
          formControlName="identificador"
          libMascaraUuid
          [maxlength]="uuidLargo"
          [placeholder]="uuidPlaceholder"
          autocomplete="off"
          spellcheck="false"
          class="font-mono"
          [invalid]="form.controls.identificador.invalid && form.controls.identificador.touched"
        />
        <lib-field-error
          [control]="form.controls.identificador"
          [messages]="{ pattern: h.crear.uuidInvalido }"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="software-pin" class="text-[0.8rem] font-medium text-brand-text">
          {{ h.campos.pin }}
          @if (!software()) {
            <span class="ml-px text-red-500">*</span>
          }
        </label>
        <!-- `new-password`: los navegadores ignoran `off` y ofrecerían la clave de la cuenta. -->
        <p-password
          inputId="software-pin"
          formControlName="pin"
          autocomplete="new-password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
          [invalid]="form.controls.pin.invalid && form.controls.pin.touched"
        />
        <lib-field-error [control]="form.controls.pin" />
        <p class="m-0 text-[0.72rem] text-brand-muted">
          {{ software() ? h.actualizar.pinHint : h.crear.pinHint }}
        </p>
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="software-test-set-id" class="text-[0.8rem] font-medium text-brand-text">
          {{ h.campos.testSetId }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <input
          id="software-test-set-id"
          pInputText
          formControlName="test_set_id"
          libMascaraUuid
          [maxlength]="uuidLargo"
          [placeholder]="uuidPlaceholder"
          autocomplete="off"
          spellcheck="false"
          class="font-mono"
          [invalid]="form.controls.test_set_id.invalid && form.controls.test_set_id.touched"
        />
        <lib-field-error
          [control]="form.controls.test_set_id"
          [messages]="{ pattern: h.crear.uuidInvalido }"
        />
      </div>

      @if (error(); as fallo) {
        <app-rededoc-error
          [titulo]="software() ? h.errorAccion.tituloActualizar : h.errorAccion.titulo"
          [error]="fallo"
          [emisorLabel]="t().asistenteElectronico.rededoc.errorAccion.emisor"
        />
      }

      <!-- Los botones van dentro del form para que «Guardar» lo envíe (y active libFocusInvalid). -->
      <div class="flex justify-end gap-2 pt-1">
        <p-button
          type="button"
          severity="secondary"
          [text]="true"
          [label]="t().common.actions.cancel"
          [disabled]="guardando()"
          (onClick)="cerrar()"
        />
        <p-button
          type="submit"
          icon="pi pi-check"
          [label]="h.crear.guardar"
          [loading]="guardando()"
          [disabled]="guardando()"
        />
      </div>
    </form>
  }
</p-dialog>
