@let acceso = t().asistenteElectronico.acceso;

<!-- Mismo chrome que las secciones de Configuración: chip, título y pista. -->
<section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
  <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
    <span
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
    >
      <i [class]="icono()" aria-hidden="true"></i>
    </span>
    <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
      <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
        {{ t().asistenteElectronico.variantes[variante()].title }}
      </h2>
      <p class="m-0 text-[0.75rem] text-brand-muted">{{ acceso.hint }}</p>
    </div>
  </div>

  <div class="flex flex-wrap items-center justify-between gap-x-5 gap-y-3 px-5 py-4">
    <p class="m-0 min-w-[15rem] flex-1 text-[0.8rem] leading-relaxed text-brand-muted">
      {{ acceso.desc }}
    </p>
    <p-button
      type="button"
      icon="pi pi-arrow-right"
      iconPos="right"
      severity="secondary"
      [outlined]="true"
      [label]="acceso.abrir"
      (onClick)="abrir()"
    />
  </div>
</section>
