@let f = t().entities.movimientoInventario.form;

<lib-breadcrumb [items]="breadcrumbItems()" />

<form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off" class="flex flex-col gap-5">
  <!-- ── Barra de acciones ─────────────────────────────────────────────────── -->
  <lib-page-actions>
    <p-button
      type="button"
      [label]="t().common.actions.back"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      [label]="t().common.actions.save"
      size="small"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="form.invalid || form.pending || isSaving()"
    />
  </lib-page-actions>

  <!-- ── Sección: Información general ──────────────────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-file-edit text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
          {{ documentName() }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">
          {{ isEditMode() ? f.editHint : f.createHint }}
        </p>
      </div>
    </div>

    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
        <!-- Contacto -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="contacto" class="movimiento-form__label">
            {{ f.fields.contacto }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-contacto-select
            inputId="contacto"
            formControlName="contacto"
            [placeholder]="f.fields.contactoPlaceholder"
            [invalid]="form.controls.contacto.invalid && form.controls.contacto.touched"
          />
          <lib-field-error
            [control]="form.controls.contacto"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Almacén -->
        <div class="flex flex-col gap-1.5">
          <label for="almacen" class="movimiento-form__label">
            {{ f.fields.almacen }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-api-select
            inputId="almacen"
            formControlName="almacen"
            [endpoint]="almacenEndpoint"
            [suggestedIndex]="almacenSuggestedIndex()"
            [placeholder]="f.fields.almacenPlaceholder"
            [invalid]="form.controls.almacen.invalid && form.controls.almacen.touched"
          />
          <lib-field-error
            [control]="form.controls.almacen"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Fecha -->
        <div class="flex flex-col gap-1.5">
          <label for="fecha" class="movimiento-form__label">
            {{ f.fields.fecha }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <p-datepicker
            inputId="fecha"
            formControlName="fecha"
            [showIcon]="true"
            appendTo="body"
            [fluid]="true"
            [invalid]="form.controls.fecha.invalid && form.controls.fecha.touched"
          />
          <lib-field-error
            [control]="form.controls.fecha"
            [messages]="{ required: f.validation.required }"
          />
        </div>
      </div>
    </div>

    <!-- Más información: los opcionales que menos se tocan (como en el ERP anterior). -->
    <app-mas-informacion [campos]="['comentario']">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
        <!-- Comentario -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="comentario" class="movimiento-form__label">{{ f.fields.comentario }}</label>
          <textarea
            id="comentario"
            pTextarea
            formControlName="comentario"
            rows="3"
            maxlength="500"
            class="w-full"
          ></textarea>
        </div>
      </div>
    </app-mas-informacion>
  </section>

  <!-- Líneas: card propia; las tabs y la botonera de la tabla son su cabecera -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <p-tabs
      class="[&_.p-tablist-tab-list]:px-5 [&_.p-tabpanels]:p-0 max-[576px]:[&_.p-tablist-tab-list]:px-4"
      value="detalles"
    >
      <p-tablist>
        <p-tab value="detalles">{{ t().entities.inventarioDetalle.title }}</p-tab>
      </p-tablist>

      <p-tabpanels>
        <p-tabpanel value="detalles">
          <app-inventario-documento-detalles
            #detallesTabla
            [detalles]="form.controls.detalles"
            [documentId]="documentId()"
            [almacenPorDefecto]="form.controls.almacen.value"
            [costoField]="costoField()"
            [showOperacion]="showOperacion()"
          />
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </section>

  <!-- Resumen del documento: fuera de la card, flotando bajo ella -->
  @if (detallesTabla.hayLineas()) {
    <app-inventario-documento-resumen [resumen]="detallesTabla.resumen()" />
  }
</form>

<p-confirmdialog />
