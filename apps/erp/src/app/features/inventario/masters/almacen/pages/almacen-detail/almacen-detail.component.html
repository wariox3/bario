@let det = t().entities.almacen.detail;

<lib-breadcrumb [items]="breadcrumbItems()" />

<!-- ── Encabezado de página ──────────────────────────────────────────────────── -->
<header class="flex items-center gap-2">
  <p-button
    type="button"
    [label]="t().common.actions.back"
    icon="pi pi-arrow-left"
    severity="secondary"
    [outlined]="true"
    size="small"
    (onClick)="onBack()"
  />
  @if (almacen()) {
    <p-button
      type="button"
      [label]="t().common.actions.edit"
      icon="pi pi-pencil"
      size="small"
      (onClick)="onEdit()"
    />
  }
</header>

@if (isLoading()) {
  <div
    class="flex items-center justify-center rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface py-20 text-brand-muted"
  >
    <i class="pi pi-spin pi-spinner text-xl"></i>
  </div>
} @else if (notFound()) {
  <div
    class="flex flex-col items-center rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface px-6 py-16 text-center"
  >
    <i class="pi pi-inbox mb-3 text-2xl text-brand-muted opacity-50"></i>
    <p class="m-0 text-[0.95rem] font-bold text-brand-text">{{ det.notFound.title }}</p>
    <p class="m-0 mt-1 max-w-70 text-[0.8rem] leading-relaxed text-brand-muted">
      {{ det.notFound.desc }}
    </p>
  </div>
} @else if (almacen(); as a) {
  <!-- ── Información general ─────────────────────────────────────────────────── -->
  <!-- Patrón "ficha de detalle en grupos" del sistema, igual que contacto, ítem y
       sede. Sin `<lib-detail-header>`: repetía el nombre, que ya está acá abajo.
       La identidad la dan la miga y el `<h1>` accesible. -->
  <h1 class="sr-only">{{ a.nombre }}</h1>

  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-3.5">
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-box text-[1rem]"></i>
      </span>
      <h2 class="m-0 text-[0.9rem] font-bold tracking-tight text-brand-text">
        {{ det.sections.general }}
      </h2>
    </div>

    <dl class="px-5 py-4">
      <div class="flex flex-col gap-0.5">
        <dt class="almacen-detail__label">{{ t().entities.almacen.columns.nombre }}</dt>
        <dd class="almacen-detail__value" [class.almacen-detail__value--empty]="!a.nombre">
          {{ a.nombre || '—' }}
        </dd>
      </div>
    </dl>
  </section>
}
