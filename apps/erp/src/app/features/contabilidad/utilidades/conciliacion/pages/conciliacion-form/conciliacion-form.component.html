@let f = t().entities.conciliacion.form;

<lib-breadcrumb [items]="breadcrumbItems()" />

<form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off" class="flex flex-col gap-5">
  <!-- ── Encabezado de página ──────────────────────────────────────────────── -->
  <header class="flex items-center gap-2">
    <p-button
      type="button"
      [label]="t().common.actions.back"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      [label]="t().common.actions.save"
      size="small"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="form.invalid || form.pending || isSaving()"
    />
  </header>

  <!-- ── Sección: Periodo y cuenta ─────────────────────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-sync text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
          {{ isEditMode() ? f.editTitle : f.createTitle }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">{{ f.sectionHint }}</p>
      </div>
    </div>

    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-3">
        <!-- Cuenta banco -->
        <div class="flex flex-col gap-1.5">
          <label for="cuenta_banco" class="conciliacion-form__label">
            {{ f.fields.cuentaBanco }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-api-select
            inputId="cuenta_banco"
            formControlName="cuenta_banco"
            [endpoint]="cuentaBancoEndpoint"
            [placeholder]="f.fields.cuentaBancoPlaceholder"
            [invalid]="form.controls.cuenta_banco.invalid && form.controls.cuenta_banco.touched"
          />
          <lib-field-error
            [control]="form.controls.cuenta_banco"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Fecha desde -->
        <div class="flex flex-col gap-1.5">
          <label for="fecha_desde" class="conciliacion-form__label">
            {{ f.fields.fechaDesde }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <p-datepicker
            inputId="fecha_desde"
            formControlName="fecha_desde"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            appendTo="body"
            [fluid]="true"
            [invalid]="form.controls.fecha_desde.invalid && form.controls.fecha_desde.touched"
          />
          <lib-field-error
            [control]="form.controls.fecha_desde"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Fecha hasta -->
        <div class="flex flex-col gap-1.5">
          <label for="fecha_hasta" class="conciliacion-form__label">
            {{ f.fields.fechaHasta }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <p-datepicker
            inputId="fecha_hasta"
            formControlName="fecha_hasta"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            appendTo="body"
            [fluid]="true"
            [invalid]="form.controls.fecha_hasta.invalid && form.controls.fecha_hasta.touched"
          />
          <lib-field-error
            [control]="form.controls.fecha_hasta"
            [messages]="{ required: f.validation.required }"
          />
        </div>
      </div>

      <!-- El rango es del grupo, no de un campo: su error se muestra aparte. -->
      @if (form.hasError('rangoFechasInvalido') && form.controls.fecha_hasta.touched) {
        <p class="m-0 mt-3 text-[0.78rem] text-red-600">{{ f.validation.rangoInvalido }}</p>
      }
    </div>
  </section>
</form>

<!-- ── Banco de trabajo: solo con el registro ya creado ───────────────────── -->
@if (isEditMode()) {
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <p-tabs [value]="activeTab()" (valueChange)="activeTab.set($any($event))">
        <p-tablist>
          <p-tab value="detalles">{{ f.tabs.detalles }}</p-tab>
          <p-tab value="soporte">{{ f.tabs.soporte }}</p-tab>
        </p-tablist>

        <p-tabpanels>
          <p-tabpanel value="detalles">
            <app-conciliacion-detalles-tab
              [conciliacionId]="conciliacionId()"
              [canOperate]="true"
              (conciliadoChange)="onConciliado()"
            />
          </p-tabpanel>

          <p-tabpanel value="soporte">
            <app-conciliacion-soportes-tab
              [conciliacionId]="conciliacionId()"
              [canOperate]="true"
              [reloadToken]="soporteReloadToken()"
            />
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>
    </div>
  </section>
}
