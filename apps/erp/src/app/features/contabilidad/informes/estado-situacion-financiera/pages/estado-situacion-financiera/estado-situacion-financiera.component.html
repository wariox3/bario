<!--
  Informe "Estado de situación financiera".
  Gemelo del estado de resultados: el panel solo muestra el periodo y la tabla va
  plana, con clase y grupo al frente. Sin PDF.
-->
<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="nombre">
  <app-movimiento-informe-params
    toolbar
    [form]="form"
    idPrefix="esf"
    [showCuentas]="false"
    [showSoloConSaldo]="false"
  >
    <app-movimiento-informe-actions
      acciones
      [loading]="isLoading()"
      [exportingExcel]="isExportingExcel()"
      [busy]="isBusy()"
      [canExport]="canExport()"
      [showPdf]="soportaPdf"
      [exportingPdf]="isExportingPdf()"
      [hint]="hint()"
      (generar)="generar()"
      (excel)="exportExcel()"
      (pdf)="exportPdf()"
    />
  </app-movimiento-informe-params>

  <app-movimiento-informe-table
    table
    [rows]="rows()"
    [amounts]="montos()"
    [empty]="empty"
    [totales]="totales()"
    [loading]="isLoading()"
    [generated]="generated()"
    [showUbicacion]="true"
    [jerarquia]="false"
    [descuadre]="false"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    (pageChange)="onPageChange($event)"
  />
</lib-list-shell>
