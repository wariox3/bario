<!--
  Informe "Balance de prueba".
  Chrome estándar (<lib-list-shell>), pero el slot [toolbar] no lleva el toolbar
  de filtros sino el panel de parámetros del reporte y su botonera. La tabla
  arranca vacía hasta Generar; a partir de ahí pagina, y los totales del pie
  vienen de la acción `totales/` (cubren el informe completo, no la página).
  Sin PDF: la familia de endpoints nueva no lo sirve.
-->
<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="nombre">
  <div toolbar class="informe-toolbar">
    <app-balance-prueba-params [form]="form" />

    <app-informe-cuentas-actions
      [loading]="isLoading()"
      [exportingExcel]="isExportingExcel()"
      [busy]="isBusy()"
      [canExport]="canExport()"
      [showPdf]="false"
      [hint]="hint()"
      (generar)="generar()"
      (excel)="exportExcel()"
    />
  </div>

  <app-balance-prueba-table
    table
    [rows]="rows()"
    [totales]="totales()"
    [loading]="isLoading()"
    [generated]="generated()"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    (pageChange)="onPageChange($event)"
  />
</lib-list-shell>
