<!--
  Informe "Estado de resultados".
  El más simple de los nueve: el panel solo muestra el periodo (sin rango de
  cuentas ni banderas) y la tabla va plana, con clase y grupo al frente. Sin PDF.
-->
@let d = t().entities.informeCuentas;

<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="nombre">
  <app-movimiento-informe-params
    toolbar
    [form]="form"
    idPrefix="er"
    [showCuentas]="false"
    [showSoloConSaldo]="false"
    [showDetalle]="true"
  >
    <!--
      Centro de costo: no hay selector propio en el ERP, se usa el autocomplete
      genérico contra su master, como en sede-form y contrato-form.
    -->
    <div class="mi-params__field">
      <label for="er-centro-costo" class="mi-params__label">{{ d.params.centroCosto }}</label>
      <lib-api-autocomplete
        inputId="er-centro-costo"
        [formControl]="centroCosto"
        [endpoint]="centroCostoEndpoint"
        [placeholder]="d.params.centroCostoPlaceholder"
      />
    </div>

    <div class="mi-params__field">
      <label for="er-presentacion" class="mi-params__label">{{
        t().entities.estadoResultados.presentacion.label
      }}</label>
      <p-select
        inputId="er-presentacion"
        [formControl]="presentacion"
        [options]="presentaciones()"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        [fluid]="true"
      />
    </div>

    <app-movimiento-informe-actions
      acciones
      [loading]="isLoading()"
      [exportingExcel]="isExportingExcel()"
      [busy]="isBusy()"
      [canExport]="canExport()"
      [showPdf]="soportaPdf"
      [exportingPdf]="isExportingPdf()"
      [hint]="hint()"
      (generar)="generar()"
      (excel)="exportExcel()"
      (pdf)="exportPdf()"
    />
  </app-movimiento-informe-params>

  <ng-container ngProjectAs="[table]">
    @if (formal(); as informeFormal) {
      <app-resultado-formal-table
        [informe]="informeFormal"
        [empty]="empty"
        [loading]="isLoading()"
      />
    } @else {
      <!-- Sin `totalCount`: la presentación base no pagina y el pie queda oculto. -->
      <app-movimiento-informe-table
        [rows]="rows()"
        [amounts]="montos()"
        [empty]="empty"
        [totales]="totales()"
        [loading]="isLoading()"
        [generated]="generated()"
        [showUbicacion]="true"
        [jerarquia]="false"
        [descuadre]="false"
      />
    }
  </ng-container>
</lib-list-shell>
