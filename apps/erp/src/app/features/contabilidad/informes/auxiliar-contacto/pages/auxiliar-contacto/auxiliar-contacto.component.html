<!--
  Informe "Auxiliar por contacto".
  Composición pura de las piezas compartidas: panel de parámetros con el trío
  del auxiliar (contacto, número, comprobante) y la tabla con las columnas del
  tercero, sin totales y sin PDF.
-->
@let d = t().entities.informeCuentas;

<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="nombre">
  <div toolbar class="informe-toolbar">
    <app-informe-cuentas-params [form]="form" idPrefix="atc">
      <div class="flex flex-col gap-1.5">
        <label for="atc-contacto" class="informe-params__label">{{ d.params.contacto }}</label>
        <lib-contacto-select
          inputId="atc-contacto"
          [formControl]="contacto"
          [placeholder]="d.params.contactoPlaceholder"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="atc-numero" class="informe-params__label">{{ d.params.numero }}</label>
        <p-inputnumber
          inputId="atc-numero"
          [formControl]="numero"
          [useGrouping]="false"
          [min]="0"
          [fluid]="true"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="atc-comprobante" class="informe-params__label">{{
          d.params.comprobante
        }}</label>
        <p-inputnumber
          inputId="atc-comprobante"
          [formControl]="comprobante"
          [useGrouping]="false"
          [min]="0"
          [fluid]="true"
        />
      </div>
    </app-informe-cuentas-params>

    <app-informe-cuentas-actions
      [loading]="isLoading()"
      [exportingExcel]="isExportingExcel()"
      [exportingPdf]="isExportingPdf()"
      [busy]="isBusy()"
      [canExport]="canExport()"
      [showPdf]="false"
      (generar)="generar()"
      (excel)="exportExcel()"
      (pdf)="exportPdf()"
    />
  </div>

  <app-saldos-cuenta-table
    table
    [rows]="rows()"
    [generated]="generated()"
    [showContacto]="true"
    [showTotals]="false"
  />
</lib-list-shell>
