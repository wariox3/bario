<!--
  Informe "Certificado de retención".
  Panel de parámetros compartido sin las dos banderas, con el selector de
  contacto proyectado, y tabla propia. Con PDF: el certificado se imprime.
-->
@let d = t().entities.informeCuentas;

<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="nombre">
  <div toolbar class="informe-toolbar">
    <app-informe-cuentas-params [form]="form" idPrefix="cr" [showFlags]="false">
      <div class="flex flex-col gap-1.5">
        <label for="cr-contacto" class="informe-params__label">{{ d.params.contacto }}</label>
        <lib-contacto-select
          inputId="cr-contacto"
          [formControl]="contacto"
          [placeholder]="d.params.contactoPlaceholder"
        />
      </div>
    </app-informe-cuentas-params>

    <app-informe-cuentas-actions
      [loading]="isLoading()"
      [exportingExcel]="isExportingExcel()"
      [exportingPdf]="isExportingPdf()"
      [busy]="isBusy()"
      [canExport]="canExport()"
      (generar)="generar()"
      (excel)="exportExcel()"
      (pdf)="exportPdf()"
    />
  </div>

  <app-certificado-retencion-table table [rows]="rows()" [generated]="generated()" />
</lib-list-shell>
