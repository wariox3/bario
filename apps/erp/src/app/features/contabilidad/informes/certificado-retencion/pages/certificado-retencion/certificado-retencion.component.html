<!--
  Informe "Certificado de retención".
  Migró sin tocar la tabla: sus dos importes entran por `montosDe()` y el resto
  es `[showContacto]` más jerarquía y descuadre apagados, como todos los planos.
  Sin `solo_con_saldo`, que el backend ignora en los planos.
-->
@let d = t().entities.informeCuentas;

<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="nombre">
  <app-movimiento-informe-params
    toolbar
    [form]="form"
    idPrefix="cr"
    [showSoloConSaldo]="false"
    [showDetalle]="true"
  >
    <div class="mi-params__field">
      <label for="cr-contacto" class="mi-params__label">{{ d.params.contacto }}</label>
      <lib-contacto-select
        inputId="cr-contacto"
        [formControl]="contacto"
        [placeholder]="d.params.contactoPlaceholder"
      />
    </div>

    <app-movimiento-informe-actions
      acciones
      [loading]="isLoading()"
      [exportingExcel]="isExportingExcel()"
      [busy]="isBusy()"
      [canExport]="canExport()"
      [showPdf]="soportaPdf"
      [exportingPdf]="isExportingPdf()"
      [hint]="hint()"
      (generar)="generar()"
      (excel)="exportExcel()"
      (pdf)="exportPdf()"
    />
  </app-movimiento-informe-params>

  <app-movimiento-informe-table
    table
    [rows]="rows()"
    [amounts]="montos()"
    [empty]="empty"
    [totales]="totales()"
    [loading]="isLoading()"
    [generated]="generated()"
    [showContacto]="true"
    [jerarquia]="false"
    [descuadre]="false"
    [totalCount]="totalCount()"
    [page]="page()"
    [pageSize]="pageSize()"
    (pageChange)="onPageChange($event)"
  />
</lib-list-shell>
