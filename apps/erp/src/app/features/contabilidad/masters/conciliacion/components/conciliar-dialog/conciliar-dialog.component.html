@let d = t().entities.conciliacion.detalleTab.conciliarDialog;

<p-dialog
  [visible]="visible()"
  (visibleChange)="visible.set($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!processing()"
  [dismissableMask]="!processing()"
  [style]="{ width: '28rem' }"
  [breakpoints]="{ '768px': '95vw' }"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-check-circle text-[1.05rem]"></i>
      </span>
      <div class="flex flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[1.02rem] font-bold leading-tight tracking-tight text-brand-text">
          {{ d.title }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">{{ d.subtitle }}</p>
      </div>
    </div>
  </ng-template>

  @if (visible()) {
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      libFocusInvalid
      autocomplete="off"
      class="flex flex-col gap-4 pt-1"
    >
      <div class="flex flex-col gap-1.5">
        <label for="conciliar-dias" class="text-[0.8rem] font-medium text-brand-text">
          {{ d.dias }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <p-inputnumber
          inputId="conciliar-dias"
          formControlName="dias"
          [useGrouping]="false"
          [min]="0"
          [max]="diasMax"
          [showButtons]="true"
          fluid
        />
        <p class="m-0 text-[0.75rem] text-brand-muted">{{ d.diasHint }}</p>
        <lib-field-error
          [control]="form.controls.dias"
          [messages]="{
            required: d.validation.required,
            min: d.validation.rango,
            max: d.validation.rango,
          }"
        />
      </div>

      <div class="flex justify-end gap-2">
        <p-button
          severity="secondary"
          [text]="true"
          [label]="t().common.actions.cancel"
          [disabled]="processing()"
          (onClick)="visible.set(false)"
        />
        <p-button
          type="submit"
          icon="pi pi-check-circle"
          [label]="d.submit"
          [loading]="processing()"
          [disabled]="processing()"
        />
      </div>
    </form>
  }
</p-dialog>
