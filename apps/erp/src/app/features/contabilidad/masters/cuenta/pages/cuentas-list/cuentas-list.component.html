<lib-list-shell [breadcrumb]="breadcrumbItems()" [title]="t().entities.cuenta.name">
  <lib-data-toolbar
    toolbar
    [primaryAction]="acciones.primaryAction()"
    [trailingActions]="acciones.trailingActions()"
    [searchPlaceholderKey]="'entities.cuenta.searchPlaceholder'"
    [filtersEnabled]="true"
    [activeFilters]="activeFilters()"
    [filterFields]="filterFields"
    [deleteSelectedEnabled]="hasSelection() && acciones.puedeEliminar()"
    [deleteSelectedCount]="selectedRows().length"
    (actionInvoked)="onToolbarAction($event)"
    (filtersToggle)="openFilters()"
    (filterEdit)="openFilters($event)"
    (filterRemove)="removeFilter($event)"
    (filtersClear)="clearFilters()"
    (deleteSelected)="removeSelected()"
  />

  <lib-data-table
    table
    [columns]="columns"
    [items]="items()"
    [totalCount]="totalCount()"
    [loading]="isLoading()"
    [currentPage]="currentPage()"
    [sort]="sort()"
    selectionMode="multiple"
    [selectedRows]="selectedRows()"
    [rowActions]="acciones.rowActions()"
    (pageChange)="onPageChange($event)"
    (sortChange)="onSortChange($event)"
    (selectionChange)="onSelectionChange($event)"
    (rowActionInvoked)="onRowAction($event)"
  />
</lib-list-shell>

<lib-data-filter-modal
  [fields]="filterFields"
  [value]="activeFilters()"
  [visible]="filtersVisible()"
  [focusRow]="filterFocusRow()"
  (visibleChange)="filtersVisible.set($event)"
  (apply)="onFiltersApply($event)"
/>

<p-confirmDialog />

<app-import-dialog
  [visible]="importar.visible()"
  (visibleChange)="importar.setVisible($event)"
  [title]="t().entities.cuenta.import.title"
  [subtitle]="t().entities.cuenta.import.subtitle"
  [importing]="importar.loading()"
  [errors]="importar.errors()"
  [errorSummary]="importar.errorSummary()"
  [errorTotal]="importar.errorTotal()"
  (importRequested)="importar.submit($event)"
  [exampleConfig]="exampleConfig"
/>
