@let f = t().entities.exogena.formatos;

<section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
  <div
    class="flex flex-wrap items-center gap-x-3 gap-y-2 border-b border-[rgba(20,48,73,0.08)] px-5 py-3.5"
  >
    <span
      class="flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
    >
      <i class="pi pi-list text-[1rem]"></i>
    </span>
    <h2 class="m-0 text-[0.9rem] font-bold tracking-tight text-brand-text">{{ f.title }}</h2>
  </div>

  <lib-data-toolbar
    [primaryAction]="primaryAction()"
    [searchEnabled]="false"
    (actionInvoked)="onToolbarAction($event)"
  />

  <lib-data-table
    [columns]="columns"
    [items]="formatos()"
    [totalCount]="totalFormatos()"
    [loading]="isLoading()"
    [currentPage]="page()"
    emptyTitleKey="entities.exogena.formatos.empty"
    (pageChange)="onPageChange($event)"
  />
</section>
