@let f = t().entities.asiento.form;

<lib-breadcrumb [items]="breadcrumbItems()" />

<form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off" class="flex flex-col gap-5">
  <!-- ── Encabezado de página ──────────────────────────────────────────────── -->
  <header class="flex items-center gap-2">
    <p-button
      type="button"
      [label]="t().common.actions.back"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      [label]="t().common.actions.save"
      size="small"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="form.invalid || form.pending || isSaving()"
    />
  </header>

  <!-- ── Sección: Información general ──────────────────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-book text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
          {{ isEditMode() ? f.editTitle : f.createTitle }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">{{ f.sectionHint }}</p>
      </div>
    </div>

    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
        <!-- Contacto -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="contacto" class="asiento-form__label">
            {{ f.fields.contacto }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-contacto-select
            inputId="contacto"
            formControlName="contacto"
            [placeholder]="f.fields.contactoPlaceholder"
            [invalid]="form.controls.contacto.invalid && form.controls.contacto.touched"
          />
          <lib-field-error
            [control]="form.controls.contacto"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Fecha -->
        <div class="flex flex-col gap-1.5">
          <label for="fecha" class="asiento-form__label">
            {{ f.fields.fecha }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <p-datepicker
            inputId="fecha"
            formControlName="fecha"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            appendTo="body"
            [fluid]="true"
            [invalid]="form.controls.fecha.invalid && form.controls.fecha.touched"
          />
          <lib-field-error
            [control]="form.controls.fecha"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Soporte -->
        <div class="flex flex-col gap-1.5">
          <label for="soporte" class="asiento-form__label">
            {{ f.fields.soporte }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <input
            id="soporte"
            pInputText
            formControlName="soporte"
            type="text"
            maxlength="50"
            class="w-full"
            [placeholder]="f.fields.soportePlaceholder"
          />
          <lib-field-error
            [control]="form.controls.soporte"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Comprobante -->
        <div class="flex flex-col gap-1.5">
          <label for="comprobante" class="asiento-form__label">
            {{ f.fields.comprobante }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-api-select
            inputId="comprobante"
            formControlName="comprobante"
            [endpoint]="comprobanteEndpoint"
            [params]="comprobanteParams"
            [placeholder]="f.fields.comprobantePlaceholder"
            [invalid]="form.controls.comprobante.invalid && form.controls.comprobante.touched"
          />
          <lib-field-error
            [control]="form.controls.comprobante"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <!-- Grupo de contabilidad -->
        <div class="flex flex-col gap-1.5">
          <label for="centro_costo" class="asiento-form__label">
            {{ f.fields.centroCosto }}
          </label>
          <lib-api-select
            inputId="centro_costo"
            formControlName="centro_costo"
            [endpoint]="centroCostoEndpoint"
            [placeholder]="f.fields.centroCostoPlaceholder"
          />
          <p class="m-0 text-[0.72rem] text-brand-muted">{{ f.fields.centroCostoHint }}</p>
        </div>

        <!-- Comentario -->
        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label for="comentario" class="asiento-form__label">{{ f.fields.comentario }}</label>
          <textarea
            id="comentario"
            pTextarea
            formControlName="comentario"
            rows="3"
            maxlength="500"
            class="w-full"
          ></textarea>
        </div>
      </div>
    </div>
  </section>

  <!-- ── Sección: Detalles (líneas del asiento) ────────────────────────────── -->
  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <app-contable-documento-detalles
        [detalles]="form.controls.detalles"
        [documentId]="documentId()"
        [contactoPorDefecto]="contactoCabecera()"
        [centroCostoPorDefecto]="centroCostoCabecera()"
        [showContacto]="true"
        [showNumero]="true"
        [showCentroCosto]="true"
        [showBase]="true"
        [showDetalle]="true"
        [showDescuadre]="true"
      />
    </div>
  </section>
</form>

<p-confirmdialog />
