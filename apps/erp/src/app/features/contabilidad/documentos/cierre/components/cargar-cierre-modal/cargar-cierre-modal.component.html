@let m = t().entities.cierre.cargar;

<div class="flex flex-col gap-5">
  <!-- Header: badge + título + subtítulo (estándar de modales del ERP) -->
  <div class="flex items-center gap-3.5">
    <span
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-brand-blue/15"
    >
      <i class="pi pi-calculator text-[1.1rem] text-brand-blue"></i>
    </span>
    <div class="flex flex-col gap-[0.1rem]">
      <h2
        class="m-0 text-[1.05rem] font-extrabold leading-tight tracking-[-0.03em] text-brand-navy"
      >
        {{ m.modalHeader }}
      </h2>
      <p class="m-0 text-[0.75rem] tracking-[0.01em] text-brand-muted">{{ m.modalSubtitle }}</p>
    </div>
  </div>

  <form [formGroup]="form" class="flex flex-col gap-4">
    <!-- Rango de cuentas de resultado a cerrar -->
    <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
      <div class="flex flex-col gap-1.5">
        <label for="cuenta_desde" class="text-[0.855rem] font-semibold text-brand-text">
          {{ m.fields.cuentaDesde }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <app-cuenta-select
          inputId="cuenta_desde"
          formControlName="cuenta_desde"
          [invalid]="form.controls.cuenta_desde.invalid && form.controls.cuenta_desde.touched"
        />
        <lib-field-error
          [control]="form.controls.cuenta_desde"
          [messages]="{ required: m.validation.required }"
        />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="cuenta_hasta" class="text-[0.855rem] font-semibold text-brand-text">
          {{ m.fields.cuentaHasta }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <app-cuenta-select
          inputId="cuenta_hasta"
          formControlName="cuenta_hasta"
          [invalid]="form.controls.cuenta_hasta.invalid && form.controls.cuenta_hasta.touched"
        />
        <lib-field-error
          [control]="form.controls.cuenta_hasta"
          [messages]="{ required: m.validation.required }"
        />
      </div>
    </div>

    <!-- Cuenta donde se acumula el resultado del ejercicio -->
    <div class="flex flex-col gap-1.5">
      <label for="cuenta_cierre" class="text-[0.855rem] font-semibold text-brand-text">
        {{ m.fields.cuentaCierre }}
        <span class="ml-px text-red-500">*</span>
      </label>
      <app-cuenta-select
        inputId="cuenta_cierre"
        formControlName="cuenta_cierre"
        [invalid]="form.controls.cuenta_cierre.invalid && form.controls.cuenta_cierre.touched"
      />
      <lib-field-error
        [control]="form.controls.cuenta_cierre"
        [messages]="{ required: m.validation.required }"
      />
    </div>
  </form>

  <!-- Footer -->
  <div class="mt-1 flex items-center justify-end gap-3 border-t border-[rgba(20,48,73,0.08)] pt-5">
    <p-button
      type="button"
      [label]="t().common.actions.cancel"
      [outlined]="true"
      severity="secondary"
      (onClick)="cancel()"
    />
    <p-button type="button" [label]="m.submit" [disabled]="form.invalid" (onClick)="confirm()" />
  </div>
</div>
