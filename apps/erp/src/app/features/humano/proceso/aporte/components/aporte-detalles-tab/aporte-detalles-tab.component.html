@let d = t().entities.aporte.detalles;

<div>
  <div>
    <lib-data-toolbar
      [trailingActions]="trailingActions"
      [searchEnabled]="false"
      [filtersEnabled]="true"
      [activeFilters]="activeFilters()"
      [filterFields]="filterFields"
      (filtersToggle)="openFilters()"
      (filterEdit)="openFilters($event)"
      (filterRemove)="removeFilter($event)"
      (filtersClear)="clearFilters()"
      (actionInvoked)="onToolbarAction($event)"
    />

    <lib-data-table
      [columns]="columns"
      [items]="items()"
      [totalCount]="totalCount()"
      [loading]="isLoading()"
      [currentPage]="currentPage()"
      (pageChange)="onPageChange($event)"
    />
  </div>

  <!-- Leyenda de las abreviaturas: sale de la misma metadata que los encabezados -->
  <details
    class="border-t border-[rgba(20,48,73,0.08)] px-5 py-3 text-[0.72rem] leading-relaxed text-brand-muted max-[576px]:px-4"
  >
    <summary class="cursor-pointer font-semibold">{{ d.leyendaTitulo }}</summary>
    <dl class="mt-2 grid grid-cols-2 gap-x-6 gap-y-1 sm:grid-cols-3 lg:grid-cols-4">
      @for (abreviatura of abreviaturas(); track abreviatura.sigla) {
        <div class="flex gap-1.5">
          <dt class="font-semibold text-brand-text">{{ abreviatura.sigla }}</dt>
          <dd class="m-0">{{ abreviatura.nombre }}</dd>
        </div>
      }
    </dl>
  </details>
</div>

<lib-data-filter-modal
  [fields]="filterFields"
  [value]="activeFilters()"
  [visible]="filtersVisible()"
  [focusRow]="filterFocusRow()"
  (visibleChange)="filtersVisible.set($event)"
  (apply)="onFiltersApply($event)"
/>
