@let m = t().entities.liquidacion.adicionales;

<form [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="off" class="flex flex-col gap-5">
  <!-- Header: badge + título + qué se está cargando -->
  <div class="flex items-center gap-3.5">
    <span
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px]"
      [class]="esDeduccion ? 'bg-rose-100' : 'bg-emerald-100'"
    >
      <i
        class="text-[1.1rem]"
        [class]="
          esDeduccion ? 'pi pi-minus-circle text-rose-700' : 'pi pi-plus-circle text-emerald-700'
        "
      ></i>
    </span>
    <div class="flex min-w-0 flex-col gap-[0.1rem]">
      <h2
        class="m-0 text-[1.05rem] font-extrabold leading-tight tracking-[-0.03em] text-brand-navy"
      >
        {{ titulo() }}
      </h2>
      <p class="m-0 truncate text-[0.75rem] tracking-[0.01em] text-brand-muted">
        {{ esDeduccion ? m.subtitleDeduccion : m.subtitleAdicion }}
      </p>
    </div>
  </div>

  @if (isLoading()) {
    <div class="flex items-center justify-center py-12 text-brand-muted">
      <i class="pi pi-spin pi-spinner text-xl"></i>
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
      <!-- Concepto: el catálogo ya viene acotado a la operación -->
      <div class="flex flex-col gap-1.5">
        <label for="concepto" class="text-[0.855rem] font-semibold text-brand-text">
          {{ m.fields.concepto }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <lib-api-select
          inputId="concepto"
          formControlName="concepto"
          [endpoint]="conceptoEndpoint"
          [params]="conceptoParams"
          [placeholder]="m.fields.seleccionar"
          [invalid]="form.controls.concepto.invalid && form.controls.concepto.touched"
        />
        <lib-field-error
          [control]="form.controls.concepto"
          [messages]="{ required: m.validation.required }"
        />
      </div>

      <!-- Valor -->
      <div class="flex flex-col gap-1.5">
        <label for="valor" class="text-[0.855rem] font-semibold text-brand-text">
          {{ m.fields.valor }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <p-inputnumber
          inputId="valor"
          formControlName="valor"
          mode="currency"
          currency="COP"
          locale="es-CO"
          [maxFractionDigits]="0"
          [min]="0"
          [fluid]="true"
          [invalid]="form.controls.valor.invalid && form.controls.valor.touched"
        />
        <lib-field-error
          [control]="form.controls.valor"
          [messages]="{ required: m.validation.required, min: m.validation.valorMinimo }"
        />
      </div>

      <!-- Detalle -->
      <div class="flex flex-col gap-1.5 sm:col-span-2">
        <label for="detalle" class="text-[0.855rem] font-semibold text-brand-text">
          {{ m.fields.detalle }}
        </label>
        <input
          id="detalle"
          pInputText
          formControlName="detalle"
          type="text"
          maxlength="150"
          class="w-full"
          [placeholder]="m.fields.detallePlaceholder"
        />
      </div>
    </div>
  }

  <!-- Footer -->
  <div class="mt-1 flex items-center justify-end gap-3 border-t border-[rgba(20,48,73,0.08)] pt-5">
    <p-button
      type="button"
      [label]="t().common.actions.cancel"
      [outlined]="true"
      severity="secondary"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      [label]="t().common.actions.save"
      [loading]="isSaving()"
      [disabled]="isLoading() || form.invalid || isSaving()"
    />
  </div>
</form>
