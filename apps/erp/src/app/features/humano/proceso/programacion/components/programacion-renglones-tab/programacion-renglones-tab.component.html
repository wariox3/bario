@let r = t().entities.programacion.renglones;

<div class="flex flex-col gap-3">
  <div class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.12)]">
    <lib-data-toolbar
      [primaryAction]="primaryAction()"
      [searchEnabled]="false"
      [filtersEnabled]="false"
      [deleteSelectedEnabled]="hasSelection() && capacidades().puedeEliminarRenglon"
      [deleteSelectedCount]="selectedRows().length"
      (actionInvoked)="onToolbarAction($event)"
      (deleteSelected)="removeSelected()"
    />

    <lib-data-table
      [columns]="columns()"
      [items]="items()"
      [totalCount]="totalCount()"
      [loading]="isLoading()"
      [pageSize]="pageSize"
      [currentPage]="currentPage()"
      [selectionMode]="selectionMode()"
      [selectedRows]="selectedRows()"
      [rowActions]="rowActions()"
      (pageChange)="onPageChange($event)"
      (selectionChange)="onSelectionChange($event)"
      (rowActionInvoked)="onRowAction($event)"
    />
  </div>

  <!-- Leyenda de las abreviaturas: solo cuando la tabla desglosa horas -->
  @if (mostrarLeyenda()) {
    <p class="m-0 text-[0.72rem] leading-relaxed text-brand-muted">
      <span class="font-semibold">{{ r.leyenda.titulo }}:</span>
      {{ r.leyenda.contenido }}
    </p>
  }
</div>

<p-confirmDialog />
