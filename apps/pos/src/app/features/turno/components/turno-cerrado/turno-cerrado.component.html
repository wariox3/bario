@let tx = t().turno.cerrado;
<section
  class="relative animate-fade-up overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface"
  role="status"
>
  <div
    aria-hidden="true"
    class="pointer-events-none absolute inset-y-0 right-0 w-[55%] bg-[radial-gradient(circle,rgba(20,48,73,0.12)_1px,transparent_1.6px)] [mask-image:linear-gradient(to_left,rgba(0,0,0,0.85),transparent)] bg-[size:14px_14px]"
  ></div>

  <div class="relative flex flex-wrap items-center gap-x-5 gap-y-3 px-5 py-4">
    <div class="flex min-w-[15rem] flex-1 items-center gap-3">
      <span
        class="flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px]"
        [class.bg-emerald-50]="cuadre() === 'cuadra'"
        [class.text-emerald-700]="cuadre() === 'cuadra'"
        [class.bg-red-50]="cuadre() === 'falta'"
        [class.text-red-600]="cuadre() === 'falta'"
        [class.bg-amber-50]="cuadre() === 'sobra'"
        [class.text-amber-700]="cuadre() === 'sobra'"
      >
        <i
          class="pi text-[1rem]"
          [class.pi-check]="cuadre() === 'cuadra'"
          [class.pi-exclamation-triangle]="cuadre() !== 'cuadra'"
          aria-hidden="true"
        ></i>
      </span>
      <div class="flex min-w-0 flex-col">
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">{{ titulo() }}</h2>
        <p class="m-0 mt-0.5 text-[0.8rem] leading-relaxed text-brand-muted">{{ detalle() }}</p>
      </div>
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <p-button
        type="button"
        [label]="tx.imprimir"
        icon="pi pi-print"
        severity="secondary"
        [outlined]="true"
        size="small"
        [loading]="imprimiendo()"
        [disabled]="imprimiendo()"
        (onClick)="imprimir.emit()"
      />
      <p-button
        type="button"
        icon="pi pi-times"
        severity="secondary"
        [text]="true"
        size="small"
        [ariaLabel]="tx.descartar"
        (onClick)="descartar.emit()"
      />
    </div>
  </div>
</section>
