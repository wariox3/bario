@let tx = t().caja.item;
@let f = form.controls;
<p-dialog
  [visible]="visible()"
  (visibleChange)="!$event && cerrar()"
  [modal]="true"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '576px': '94vw' }"
  [draggable]="false"
  [resizable]="false"
  [closable]="!guardando()"
  [closeOnEscape]="!guardando()"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-box text-[1.05rem]" aria-hidden="true"></i>
      </span>
      <div class="flex min-w-0 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[1.02rem] font-bold leading-tight tracking-tight text-brand-text">
          {{ tx.titulo }}
        </h2>
        <p class="m-0 truncate text-[0.75rem] text-brand-muted">{{ tx.subtitulo }}</p>
      </div>
    </div>
  </ng-template>

  <form
    #formulario
    [formGroup]="form"
    libFocusInvalid
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-4"
  >
    <div class="grid grid-cols-1 gap-x-4 gap-y-3 sm:grid-cols-2">
      <div class="flex flex-col gap-1.5">
        <label for="item-codigo" class="text-[0.8rem] font-medium text-brand-text">
          {{ tx.campos.codigo }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <input
          pInputText
          id="item-codigo"
          formControlName="codigo"
          autocomplete="off"
          class="font-mono"
        />
        <lib-field-error [control]="f.codigo" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="item-precio" class="text-[0.8rem] font-medium text-brand-text">
          {{ tx.campos.precio }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <p-inputnumber
          inputId="item-precio"
          formControlName="precio"
          mode="currency"
          currency="COP"
          locale="es-CO"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
          [fluid]="true"
          [invalid]="f.precio.invalid && f.precio.touched"
        />
        <lib-field-error [control]="f.precio" />
      </div>

      <div class="flex flex-col gap-1.5 sm:col-span-2">
        <label for="item-nombre" class="text-[0.8rem] font-medium text-brand-text">
          {{ tx.campos.nombre }}
          <span class="ml-px text-red-500">*</span>
        </label>
        <input pInputText id="item-nombre" formControlName="nombre" autocomplete="off" />
        <lib-field-error [control]="f.nombre" />
      </div>

      <div class="flex flex-col gap-1.5">
        <span class="text-[0.8rem] font-medium text-brand-text">{{ tx.campos.tipo }}</span>
        <p-selectbutton
          formControlName="tipo"
          [options]="tipos()"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          [ariaLabel]="tx.campos.tipo"
        />
      </div>

      <div class="flex flex-col justify-end gap-2 pb-1">
        <div class="flex items-center gap-2">
          <p-checkbox inputId="item-inventario" formControlName="inventario" [binary]="true" />
          <label for="item-inventario" class="text-[0.82rem] text-brand-text">
            {{ tx.campos.inventario }}
          </label>
        </div>
        <div class="flex items-center gap-2">
          <p-checkbox inputId="item-favorito" formControlName="favorito" [binary]="true" />
          <label for="item-favorito" class="text-[0.82rem] text-brand-text">
            {{ tx.campos.favorito }}
          </label>
        </div>
      </div>

      <div class="flex flex-col gap-1.5 sm:col-span-2">
        <label for="item-impuestos" class="text-[0.8rem] font-medium text-brand-text">
          {{ tx.campos.impuestos }}
        </label>
        <p-multiselect
          inputId="item-impuestos"
          formControlName="impuestos_ids"
          [options]="impuestos()"
          optionLabel="nombre"
          optionValue="id"
          display="chip"
          appendTo="body"
          [placeholder]="tx.campos.impuestosPlaceholder"
          [fluid]="true"
        />
      </div>
    </div>

    @if (f.inventario.value) {
      <p class="m-0 rounded-lg bg-amber-50 px-3 py-2 text-[0.75rem] text-amber-900">
        {{ tx.avisoInventario }}
      </p>
    }
  </form>

  <ng-template pTemplate="footer">
    <p-button
      type="button"
      [label]="t().caja.carrito.cancelar"
      severity="secondary"
      [text]="true"
      [disabled]="guardando()"
      (onClick)="cerrar()"
    />
    <p-button
      type="button"
      [label]="tx.guardar"
      icon="pi pi-check"
      [loading]="guardando()"
      [disabled]="guardando()"
      (onClick)="formulario.requestSubmit()"
    />
  </ng-template>
</p-dialog>
