@let tx = t().caja.item;
@let f = form.controls;
<p-dialog
  [visible]="visible()"
  (visibleChange)="!$event && cerrar()"
  [modal]="true"
  [header]="tx.titulo"
  [style]="{ width: '32rem' }"
  [breakpoints]="{ '576px': '94vw' }"
  [draggable]="false"
>
  <form [formGroup]="form" libFocusInvalid (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
    <div class="grid grid-cols-1 gap-x-4 gap-y-3 sm:grid-cols-2">
      <div class="flex flex-col gap-1.5">
        <label for="item-codigo" class="text-[0.78rem] font-semibold text-brand-text">
          {{ tx.campos.codigo }}
        </label>
        <input
          pInputText
          id="item-codigo"
          formControlName="codigo"
          autocomplete="off"
          class="font-mono"
        />
        <lib-field-error [control]="f.codigo" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="item-precio" class="text-[0.78rem] font-semibold text-brand-text">
          {{ tx.campos.precio }}
        </label>
        <p-inputnumber
          inputId="item-precio"
          formControlName="precio"
          mode="currency"
          currency="COP"
          locale="es-CO"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
          [fluid]="true"
          [invalid]="f.precio.invalid && f.precio.touched"
        />
        <lib-field-error [control]="f.precio" />
      </div>

      <div class="flex flex-col gap-1.5 sm:col-span-2">
        <label for="item-nombre" class="text-[0.78rem] font-semibold text-brand-text">
          {{ tx.campos.nombre }}
        </label>
        <input pInputText id="item-nombre" formControlName="nombre" autocomplete="off" />
        <lib-field-error [control]="f.nombre" />
      </div>

      <div class="flex flex-col gap-1.5">
        <span class="text-[0.78rem] font-semibold text-brand-text">{{ tx.campos.tipo }}</span>
        <p-selectbutton
          formControlName="tipo"
          [options]="tipos()"
          optionLabel="label"
          optionValue="value"
          [allowEmpty]="false"
          [ariaLabel]="tx.campos.tipo"
        />
      </div>

      <div class="flex flex-col justify-end gap-2 pb-1">
        <div class="flex items-center gap-2">
          <p-checkbox inputId="item-inventario" formControlName="inventario" [binary]="true" />
          <label for="item-inventario" class="text-[0.82rem] text-brand-text">
            {{ tx.campos.inventario }}
          </label>
        </div>
        <div class="flex items-center gap-2">
          <p-checkbox inputId="item-favorito" formControlName="favorito" [binary]="true" />
          <label for="item-favorito" class="text-[0.82rem] text-brand-text">
            {{ tx.campos.favorito }}
          </label>
        </div>
      </div>

      <div class="flex flex-col gap-1.5 sm:col-span-2">
        <label for="item-impuestos" class="text-[0.78rem] font-semibold text-brand-text">
          {{ tx.campos.impuestos }}
        </label>
        <p-multiselect
          inputId="item-impuestos"
          formControlName="impuestos_ids"
          [options]="impuestos()"
          optionLabel="nombre"
          optionValue="id"
          display="chip"
          appendTo="body"
          [placeholder]="tx.campos.impuestosPlaceholder"
          [fluid]="true"
        />
      </div>
    </div>

    @if (f.inventario.value) {
      <p class="m-0 rounded-lg bg-amber-50 px-3 py-2 text-[0.75rem] text-amber-900">
        {{ tx.avisoInventario }}
      </p>
    }

    <div class="flex justify-end gap-2">
      <p-button
        type="button"
        [label]="t().caja.carrito.cancelar"
        severity="secondary"
        [outlined]="true"
        [disabled]="guardando()"
        (onClick)="cerrar()"
      />
      <p-button
        type="submit"
        [label]="tx.guardar"
        icon="pi pi-check"
        [loading]="guardando()"
        [disabled]="guardando()"
      />
    </div>
  </form>
</p-dialog>
