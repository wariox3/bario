@let f = t().cajas.form;
<lib-breadcrumb [items]="breadcrumbItems()" />

<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  libFocusInvalid
  autocomplete="off"
  class="flex flex-col gap-5"
>
  <lib-page-actions>
    <p-button
      type="button"
      [label]="t().common.actions.back"
      icon="pi pi-arrow-left"
      severity="secondary"
      [outlined]="true"
      size="small"
      (onClick)="onCancel()"
    />
    <p-button
      type="submit"
      [label]="t().common.actions.save"
      size="small"
      icon="pi pi-check"
      [loading]="isSaving()"
      [disabled]="isSaving()"
    />
  </lib-page-actions>

  <section class="overflow-hidden rounded-xl border border-[rgba(20,48,73,0.1)] bg-brand-surface">
    <div class="flex items-center gap-3 border-b border-[rgba(20,48,73,0.08)] px-5 py-4">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
      >
        <i class="pi pi-wallet text-[1.05rem]"></i>
      </span>
      <div class="flex min-w-0 flex-1 flex-col gap-[0.1rem]">
        <h2 class="m-0 text-[0.95rem] font-bold tracking-tight text-brand-text">
          {{ isEditMode() ? f.editTitle : f.createTitle }}
        </h2>
        <p class="m-0 text-[0.75rem] text-brand-muted">
          {{ isEditMode() ? f.editSubtitle : f.createSubtitle }}
        </p>
      </div>
    </div>

    <div class="px-5 py-5 max-[576px]:px-4 max-[576px]:py-4">
      <div class="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2">
        <div class="flex flex-col gap-1.5">
          <label for="nombre" class="text-[0.855rem] font-semibold tracking-tight text-brand-text">
            {{ f.fields.nombre }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <input
            id="nombre"
            pInputText
            type="text"
            maxlength="100"
            formControlName="nombre"
            fluid
          />
          <lib-field-error
            [control]="form.controls.nombre"
            [messages]="{ required: f.validation.required, maxlength: f.validation.maxlength }"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="sede" class="text-[0.855rem] font-semibold tracking-tight text-brand-text">
            {{ f.fields.sede }}
            <span class="ml-px text-red-500">*</span>
          </label>
          <lib-api-select inputId="sede" formControlName="sede" [endpoint]="sedeEndpoint" />
          <lib-field-error
            [control]="form.controls.sede"
            [messages]="{ required: f.validation.required }"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="placa" class="text-[0.855rem] font-semibold tracking-tight text-brand-text">
            {{ f.fields.placa }}
          </label>
          <input id="placa" pInputText type="text" maxlength="50" formControlName="placa" fluid />
          <lib-field-error
            [control]="form.controls.placa"
            [messages]="{ maxlength: f.validation.maxlength }"
          />
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="tipo" class="text-[0.855rem] font-semibold tracking-tight text-brand-text">
            {{ f.fields.tipo }}
          </label>
          <input id="tipo" pInputText type="text" maxlength="100" formControlName="tipo" fluid />
          <lib-field-error
            [control]="form.controls.tipo"
            [messages]="{ maxlength: f.validation.maxlength }"
          />
        </div>

        <div class="flex flex-col gap-1.5 sm:col-span-2">
          <label
            for="ubicacion"
            class="text-[0.855rem] font-semibold tracking-tight text-brand-text"
          >
            {{ f.fields.ubicacion }}
          </label>
          <input
            id="ubicacion"
            pInputText
            type="text"
            maxlength="255"
            formControlName="ubicacion"
            fluid
          />
          <lib-field-error
            [control]="form.controls.ubicacion"
            [messages]="{ maxlength: f.validation.maxlength }"
          />
        </div>

        <label for="estado_activo" class="flex cursor-pointer items-center gap-2 sm:col-span-2">
          <p-checkbox inputId="estado_activo" formControlName="estado_activo" [binary]="true" />
          <span class="text-[0.85rem] text-brand-text">{{ f.fields.activo }}</span>
        </label>
      </div>
    </div>
  </section>
</form>
