@let tx = t().caja.carrito.editar;
<p-dialog
  [visible]="linea() !== null"
  (visibleChange)="!$event && cerrar.emit()"
  [modal]="true"
  [header]="tx.title"
  [style]="{ width: '24rem' }"
  [breakpoints]="{ '576px': '92vw' }"
  [draggable]="false"
>
  @if (linea(); as l) {
    <form [formGroup]="form" libFocusInvalid (ngSubmit)="onSubmit()" class="flex flex-col gap-4">
      <p class="m-0 text-[0.85rem] font-semibold text-brand-text">{{ l.item.nombre }}</p>

      <div class="flex flex-col gap-1.5">
        <label for="editar-precio" class="text-[0.78rem] font-semibold text-brand-text">
          {{ tx.precio }}
        </label>
        <p-inputnumber
          inputId="editar-precio"
          formControlName="precio"
          mode="currency"
          currency="COP"
          locale="es-CO"
          [minFractionDigits]="0"
          [maxFractionDigits]="2"
          [fluid]="true"
          [invalid]="form.controls.precio.invalid && form.controls.precio.touched"
        />
        <lib-field-error [control]="form.controls.precio" [messages]="{ min: tx.precioMin }" />
      </div>

      <div class="flex flex-col gap-1.5">
        <label for="editar-cantidad" class="text-[0.78rem] font-semibold text-brand-text">
          {{ tx.cantidad }}
        </label>
        <p-inputnumber
          inputId="editar-cantidad"
          formControlName="cantidad"
          [min]="1"
          [useGrouping]="false"
          [fluid]="true"
          [invalid]="form.controls.cantidad.invalid && form.controls.cantidad.touched"
        />
        <lib-field-error
          [control]="form.controls.cantidad"
          [messages]="{ min: tx.cantidadMin, max: tx.cantidadMax + ' (' + l.disponible + ')' }"
        />
      </div>

      <div class="flex justify-end gap-2 pt-1">
        <p-button
          type="button"
          [label]="tx.cancelar"
          severity="secondary"
          [outlined]="true"
          (onClick)="cerrar.emit()"
        />
        <p-button type="submit" [label]="tx.guardar" icon="pi pi-check" />
      </div>
    </form>
  }
</p-dialog>
