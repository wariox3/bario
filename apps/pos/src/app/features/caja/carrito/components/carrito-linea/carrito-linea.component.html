@let l = linea();
@let tx = t().caja.carrito.linea;
<div class="flex flex-col gap-2 py-2.5">
  <div class="flex items-start gap-2">
    <button
      type="button"
      class="group -mx-1.5 -my-1 min-w-0 flex-1 rounded-md px-1.5 py-1 text-left transition-colors hover:bg-[rgba(20,48,73,0.04)] focus-visible:outline-2 focus-visible:outline-[var(--brand-blue)] disabled:hover:bg-transparent"
      [attr.aria-label]="tx.editar + ': ' + l.item.nombre"
      [disabled]="bloqueada()"
      (click)="editar.emit(l)"
    >
      <span class="line-clamp-2 text-[0.82rem] font-semibold leading-tight text-brand-text">
        {{ l.item.nombre }}
        <!-- Pista de que la línea se edita: aparece al pasar o enfocar. -->
        <i
          class="pi pi-pencil ml-1 align-middle text-[0.65rem] text-brand-muted opacity-0 transition-opacity group-hover:opacity-100 group-focus-visible:opacity-100 group-disabled:hidden"
          aria-hidden="true"
        ></i>
      </span>
      <span class="mt-0.5 flex items-center gap-1.5 text-[0.75rem] text-brand-muted">
        <span class="font-mono tabular-nums">{{ precio() }}</span>
        @if (l.precioEditado) {
          <span class="rounded bg-amber-50 px-1 text-[0.65rem] font-medium text-amber-800">
            {{ tx.precioEditado }}
          </span>
        }
      </span>
    </button>
    <button
      type="button"
      class="flex h-7 w-7 shrink-0 items-center justify-center rounded-md text-brand-muted hover:bg-red-50 hover:text-red-600 disabled:pointer-events-none disabled:opacity-40"
      [attr.aria-label]="tx.retirar + ': ' + l.item.nombre"
      [disabled]="bloqueada()"
      (click)="retirar.emit(l.item.id)"
    >
      <i class="pi pi-trash text-[0.8rem]"></i>
    </button>
  </div>

  <div class="flex items-center justify-between gap-2">
    <div
      class="flex items-center overflow-hidden rounded-lg border border-[rgba(20,48,73,0.14)]"
      role="group"
      [attr.aria-label]="tx.cantidad"
    >
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center text-brand-muted hover:bg-[rgba(20,48,73,0.06)] hover:text-brand-text disabled:cursor-not-allowed disabled:opacity-40"
        [attr.aria-label]="tx.restar"
        [disabled]="bloqueada()"
        (click)="cantidad.emit(l.cantidad - 1)"
      >
        <i class="pi pi-minus text-[0.7rem]"></i>
      </button>
      <span
        class="min-w-9 text-center font-mono text-[0.85rem] font-semibold tabular-nums text-brand-text"
      >
        {{ l.cantidad }}
      </span>
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center text-brand-muted hover:bg-[rgba(20,48,73,0.06)] hover:text-brand-text disabled:cursor-not-allowed disabled:opacity-40"
        [attr.aria-label]="tx.sumar"
        [disabled]="enTope() || bloqueada()"
        (click)="cantidad.emit(l.cantidad + 1)"
      >
        <i class="pi pi-plus text-[0.7rem]"></i>
      </button>
    </div>
    <span class="font-mono text-[0.9rem] font-bold tabular-nums text-brand-text">{{ neto() }}</span>
  </div>
</div>
