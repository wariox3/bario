@let p = producto();
@let tx = t().caja.producto;
<article class="group relative h-full">
  <button
    type="button"
    class="flex h-full w-full flex-col overflow-hidden rounded-xl border bg-brand-surface text-left transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[var(--brand-blue)] disabled:cursor-not-allowed"
    [class]="
      cantidad() > 0
        ? 'border-[var(--brand-blue)] ring-1 ring-[var(--brand-blue)]'
        : 'border-[rgba(20,48,73,0.1)] hover:border-[rgba(20,48,73,0.22)]'
    "
    [class.opacity-60]="agotado()"
    [disabled]="agotado()"
    [attr.aria-label]="tx.agregar + ': ' + p.nombre"
    (click)="agregar.emit(p)"
  >
    <div class="relative aspect-[4/3] w-full bg-[rgba(20,48,73,0.04)]">
      @if (p.imagenUrl) {
        <img [src]="p.imagenUrl" alt="" loading="lazy" class="h-full w-full object-cover" />
      } @else {
        <div class="flex h-full w-full items-center justify-center text-brand-muted-2">
          <i class="pi pi-box text-2xl" aria-hidden="true"></i>
        </div>
      }

      @if (p.disponible !== null) {
        <span
          class="absolute bottom-2 left-2 rounded-full px-2 py-0.5 text-[0.7rem] font-medium"
          [class]="agotado() ? 'bg-red-50 text-red-700' : 'bg-emerald-50 text-emerald-800'"
        >
          @if (agotado()) {
            {{ tx.agotado }}
          } @else {
            <span class="font-mono tabular-nums">{{ p.disponible }}</span> {{ tx.disponibles }}
          }
        </span>
      }
    </div>

    <div class="flex w-full flex-1 flex-col gap-1 px-3 py-2.5">
      @if (p.codigo) {
        <span class="truncate font-mono text-[0.7rem] text-brand-muted">{{ p.codigo }}</span>
      }
      <span class="line-clamp-2 text-[0.85rem] font-semibold leading-tight text-brand-text">
        {{ p.nombre }}
      </span>
      <span class="mt-auto pt-1 font-mono text-[0.95rem] font-bold tabular-nums text-brand-text">
        {{ precio() }}
      </span>
    </div>
  </button>

  @if (puedeEditar()) {
    <!-- Siempre visible: quien recién usa la caja tiene que poder encontrarlo. -->
    <button
      type="button"
      class="absolute right-11 top-2 flex h-8 w-8 items-center justify-center rounded-full bg-white/90 text-brand-muted transition-colors hover:text-brand-text"
      [attr.aria-label]="tx.editar + ': ' + p.nombre"
      [title]="tx.editar"
      (click)="editar.emit(p.id)"
    >
      <i class="pi pi-pencil text-[0.8rem]" aria-hidden="true"></i>
    </button>
    <button
      type="button"
      class="absolute right-2 top-2 flex h-8 w-8 items-center justify-center rounded-full bg-white/90 transition-colors hover:text-amber-500"
      [class]="p.favorito ? 'text-amber-500' : 'text-brand-muted'"
      [attr.aria-pressed]="p.favorito"
      [attr.aria-label]="p.favorito ? tx.quitarFavorito : tx.marcarFavorito"
      (click)="onFavorito()"
    >
      <i class="pi text-sm" [class]="p.favorito ? 'pi-star-fill' : 'pi-star'"></i>
    </button>
  }

  @if (cantidad() > 0) {
    <span
      class="pointer-events-none absolute left-2 top-2 flex h-7 min-w-7 shadow-sm ring-2 ring-white items-center justify-center rounded-full bg-[var(--brand-blue)] px-1.5 font-mono text-[0.72rem] font-bold tabular-nums text-white"
      [attr.aria-label]="tx.enVenta + ': ' + cantidad()"
    >
      {{ cantidad() }}
    </span>
  }
</article>
