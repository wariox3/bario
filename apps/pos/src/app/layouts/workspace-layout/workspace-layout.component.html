<header class="app-header">
  <div class="app-header__brand">
    <button
      class="app-header__hamburger"
      (click)="toggleDrawer()"
      [attr.aria-label]="t().layout.menuLabel"
    >
      <i class="pi pi-bars"></i>
    </button>
    <img src="/logos/reddoc.svg" alt="RedDoc" class="app-header__logo" />
    <span class="app-header__divider" aria-hidden="true"></span>
    <app-tenant-badge />
  </div>
  <div class="app-header__actions">
    <lib-app-switcher />
    <app-user-menu />
  </div>
</header>

<div class="workspace-body">
  <aside class="workspace-sidebar" [class.workspace-sidebar--colapsado]="colapsado()">
    <nav class="workspace-nav">
      <ng-container *ngTemplateOutlet="navTpl; context: { $implicit: false, rail: colapsado() }" />
    </nav>
    <button
      type="button"
      class="workspace-sidebar__toggle"
      [attr.aria-expanded]="!colapsado()"
      [attr.aria-label]="colapsado() ? t().layout.sidebar.expandir : t().layout.sidebar.colapsar"
      [pTooltip]="colapsado() ? t().layout.sidebar.expandir : ''"
      tooltipPosition="right"
      (click)="alternarSidebar()"
    >
      <i
        class="pi"
        [class.pi-angle-double-right]="colapsado()"
        [class.pi-angle-double-left]="!colapsado()"
        aria-hidden="true"
      ></i>
      <span class="workspace-nav__label">{{ t().layout.sidebar.colapsar }}</span>
    </button>
  </aside>

  <main class="workspace-main">
    @switch (estadoPestana()) {
      @case ('activa') {
        <router-outlet />
      }
      @case ('ocupada') {
        @let tx = t().layout.pestanaOcupada;
        <!--
          Otra pestaña tiene la caja de esta empresa. No se monta ninguna sección
          para que esta no escriba las ventas; cuando la otra se cierre, la caja
          aparece sola.
        -->
        <div class="flex flex-1 items-center justify-center p-6">
          <div class="flex max-w-[26rem] flex-col items-center text-center" role="status">
            <span
              class="grid h-12 w-12 place-items-center rounded-[14px] bg-[#fdf3e1] text-[#b45309]"
            >
              <i class="pi pi-clone text-[1.15rem]" aria-hidden="true"></i>
            </span>
            <h1 class="m-0 mt-4 text-[1.1rem] font-bold text-brand-text">{{ tx.titulo }}</h1>
            <p class="m-0 mt-2 text-[0.85rem] leading-relaxed text-[#526680]">{{ tx.desc }}</p>
            <p
              class="m-0 mt-4 flex items-center gap-2 rounded-xl bg-[#f2f4f7] px-3.5 py-2.5 text-xs text-[#526680]"
            >
              <i class="pi pi-spin pi-spinner text-[0.75rem]" aria-hidden="true"></i>
              {{ tx.esperando }}
            </p>
            <a
              routerLink="/contenedores"
              class="mt-4 text-[0.8rem] font-medium text-brand-blue hover:underline"
              >{{ tx.cambiarEmpresa }}</a
            >
          </div>
        </div>
      }
    }
  </main>
</div>

<!-- Drawer móvil -->
<p-drawer
  [visible]="drawerVisible()"
  (visibleChange)="drawerVisible.set($event)"
  position="left"
  [header]="t().layout.drawerHeader"
>
  <nav class="workspace-nav">
    <ng-container *ngTemplateOutlet="navTpl; context: { $implicit: true }" />
  </nav>
</p-drawer>

<!-- Navegación compartida entre sidebar y drawer -->
<ng-template #navTpl let-inDrawer let-rail="rail">
  @for (item of items; track item.path) {
    <a
      class="workspace-nav__item"
      [routerLink]="itemPath(item)"
      routerLinkActive="workspace-nav__item--active"
      [attr.aria-label]="rail ? t().layout.nav[item.labelKey] : null"
      [pTooltip]="rail ? t().layout.nav[item.labelKey] : ''"
      tooltipPosition="right"
      (click)="inDrawer && drawerVisible.set(false)"
    >
      <i class="workspace-nav__icon {{ item.iconClass }}"></i>
      <span class="workspace-nav__label">{{ t().layout.nav[item.labelKey] }}</span>
    </a>
  }
</ng-template>
