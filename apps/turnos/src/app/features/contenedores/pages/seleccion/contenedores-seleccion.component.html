<section class="mx-auto w-full max-w-3xl px-6 py-10">
  <header class="mb-8">
    <h1 class="text-xl font-semibold text-[var(--brand-navy)]">Selecciona un contenedor</h1>
    <p class="mt-1 text-sm text-[var(--brand-muted)]">
      Elige la empresa con la que quieres trabajar.
    </p>
  </header>

  @if (isLoading()) {
    <ul class="flex flex-col gap-3">
      @for (item of skeletonItems; track $index) {
        <li class="h-16 animate-pulse rounded-xl border border-black/5 bg-black/5"></li>
      }
    </ul>
  } @else if (isEmpty()) {
    <div
      class="flex flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-black/10 py-16 text-center"
    >
      <i class="pi pi-inbox text-3xl text-[var(--brand-muted)]"></i>
      <p class="text-sm text-[var(--brand-muted)]">No tienes contenedores</p>
    </div>
  } @else {
    <ul class="flex flex-col gap-3">
      @for (contenedor of contenedores(); track contenedor.cliente_id) {
        <li>
          <button
            type="button"
            class="flex w-full items-center gap-4 rounded-xl border border-black/5 bg-white px-4 py-3 text-left transition hover:border-[var(--brand-blue)]/40 hover:shadow-sm"
            (click)="enter(contenedor)"
          >
            <span
              class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg bg-[var(--brand-navy)] text-sm font-semibold text-white"
              aria-hidden="true"
            >
              {{ initials(contenedor.nombre) }}
            </span>
            <span class="flex min-w-0 flex-col">
              <span class="truncate text-sm font-semibold text-[var(--brand-text)]">
                {{ contenedor.nombre }}
              </span>
              <span class="truncate text-xs text-[var(--brand-muted)]">
                {{ contenedor.rol_nombre }}
              </span>
            </span>
            <i class="pi pi-chevron-right ml-auto text-xs text-[var(--brand-muted)]"></i>
          </button>
        </li>
      }
    </ul>
  }
</section>
