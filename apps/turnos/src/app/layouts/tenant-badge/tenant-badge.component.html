@if (nombre()) {
  <div
    class="tenant-badge"
    role="img"
    [attr.aria-label]="t().layout.tenantBadge.ariaLabel + ': ' + nombre()"
  >
    <span class="tenant-badge__mono overflow-hidden" aria-hidden="true">
      @if (imagen(); as src) {
        <img [src]="src" alt="" class="size-full object-cover" />
      } @else {
        {{ inicial() }}
      }
    </span>
    <span class="tenant-badge__name" [title]="nombre()">{{ nombre() }}</span>
  </div>
}
