<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="!isSaving()"
  [closeOnEscape]="!isSaving()"
  [style]="{ width: '480px' }"
  [breakpoints]="{ '576px': '92vw' }"
>
  <!-- Header -->
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3.5">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-brand-blue/15"
      >
        <i class="pi pi-lock text-[1.1rem] text-brand-blue"></i>
      </span>
      <div class="flex flex-col gap-[0.1rem]">
        <h2
          class="m-0 text-[1.05rem] font-extrabold leading-tight tracking-[-0.03em] text-brand-text"
        >
          Cambiar contraseña
        </h2>
        <p class="m-0 text-[0.75rem] tracking-[0.01em] text-brand-muted">
          Elige una contraseña segura que no uses en otros sitios
        </p>
      </div>
    </div>
  </ng-template>

  @if (visible()) {
    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="flex flex-col gap-[1.1rem]"
      autocomplete="off"
      novalidate
    >
      <!-- Contraseña actual -->
      <div class="flex flex-col">
        <label
          for="seg-actual"
          class="mb-1.5 text-[0.78rem] font-semibold tracking-[-0.01em] text-brand-navy"
        >
          Contraseña actual <span class="ml-px text-red-500">*</span>
        </label>
        <p-password
          inputId="seg-actual"
          formControlName="passwordActual"
          [toggleMask]="true"
          [feedback]="false"
          fluid
          [invalid]="actualControl.invalid && actualControl.touched"
        />
        <lib-field-error
          [control]="actualControl"
          [messages]="{ required: 'La contraseña actual es obligatoria.' }"
        />
      </div>

      <!-- Separador: de lo que tienes a lo que vas a poner -->
      <div class="border-t border-[rgba(20,48,73,0.08)]"></div>

      <!-- Nueva contraseña -->
      <div class="flex flex-col">
        <label
          for="seg-nueva"
          class="mb-1.5 text-[0.78rem] font-semibold tracking-[-0.01em] text-brand-navy"
        >
          Nueva contraseña <span class="ml-px text-red-500">*</span>
        </label>
        <p-password
          inputId="seg-nueva"
          formControlName="passwordNueva"
          [toggleMask]="true"
          [feedback]="true"
          promptLabel="Ingresa una contraseña"
          weakLabel="Débil"
          mediumLabel="Media"
          strongLabel="Fuerte"
          fluid
          [invalid]="nuevaControl.invalid && nuevaControl.touched"
        />
        <lib-field-error
          [control]="nuevaControl"
          [messages]="{
            required: 'La nueva contraseña es obligatoria.',
            minlength: 'Mínimo 8 caracteres.',
          }"
        />
      </div>

      <!-- Confirmar contraseña -->
      <div class="flex flex-col">
        <label
          for="seg-confirmar"
          class="mb-1.5 text-[0.78rem] font-semibold tracking-[-0.01em] text-brand-navy"
        >
          Confirmar contraseña <span class="ml-px text-red-500">*</span>
        </label>
        <p-password
          inputId="seg-confirmar"
          formControlName="passwordConfirmar"
          [toggleMask]="true"
          [feedback]="false"
          fluid
          [invalid]="confirmarControl.invalid && confirmarControl.touched"
        />
        <lib-field-error
          [control]="confirmarControl"
          [messages]="{
            required: 'Debes confirmar la contraseña.',
            notMatching: 'Las contraseñas no coinciden.',
          }"
        />
      </div>
    </form>
  }

  <!-- Footer -->
  <ng-template pTemplate="footer">
    <div class="flex items-center justify-end gap-2 pt-2">
      <p-button
        label="Cancelar"
        [outlined]="true"
        severity="secondary"
        (onClick)="onCancel()"
        [disabled]="isSaving()"
      />
      <p-button
        label="Actualizar contraseña"
        icon="pi pi-check"
        [loading]="isSaving()"
        [disabled]="form.invalid || isSaving()"
        (onClick)="submit()"
      />
    </div>
  </ng-template>
</p-dialog>
