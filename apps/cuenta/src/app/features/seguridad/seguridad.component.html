<div class="p-8 max-[576px]:px-4 max-[576px]:py-5">
  <!-- Page header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-brand-text tracking-tight m-0 mb-1">Seguridad</h1>
    <p class="text-sm text-brand-muted m-0">Gestiona la seguridad de tu cuenta</p>
  </div>

  <div class="flex flex-col gap-5 animate-fade-up">
    <!-- Security status card: estado + la única acción de la página -->
    <div class="bg-brand-surface border border-[rgba(20,48,73,0.1)] rounded-xl overflow-hidden">
      <div class="flex items-center gap-3 px-5 py-4 max-[576px]:flex-wrap max-[576px]:gap-y-3.5">
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-sky-50 text-sky-700"
        >
          <i class="pi pi-shield text-[1.05rem]"></i>
        </span>
        <div class="flex flex-1 flex-col gap-[0.1rem] min-w-0">
          <h2 class="m-0 text-[0.95rem] font-bold text-brand-text tracking-tight">
            Tu cuenta está protegida
          </h2>
          <p class="m-0 text-[0.75rem] text-brand-muted">
            Actualiza tu contraseña periódicamente para mantener tu cuenta segura
          </p>
        </div>
        <p-button
          label="Cambiar contraseña"
          icon="pi pi-lock"
          [outlined]="true"
          size="small"
          class="shrink-0 max-[576px]:w-full"
          styleClass="max-[576px]:w-full"
          (onClick)="openDialog()"
        />
      </div>
    </div>

    <!-- Autenticación en varias fases -->
    <app-mfa-metodos-card
      (activado)="onMfaActivado($event)"
      (desactivar)="onDesactivarMfa($event)"
    />
  </div>
</div>

<app-cambiar-password-dialog
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
/>
