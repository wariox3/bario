<lib-breadcrumb [items]="breadcrumb()" />

<h1 class="list-shell__title">{{ title() }}</h1>

<!-- Un solo recuadro: la botonera (proyectada) es su cabecera y la tabla el
     cuerpo. El total de registros lo da el paginador. -->
<section class="list-shell__frame">
  <ng-content select="[toolbar]" />

  <div class="list-shell__table">
    <ng-content select="[table]" />
  </div>
</section>
