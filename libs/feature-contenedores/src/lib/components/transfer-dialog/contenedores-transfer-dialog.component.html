<p-dialog
  [visible]="visible()"
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  [closable]="true"
  [style]="{ width: '480px' }"
  [breakpoints]="{ '575px': '95vw' }"
  styleClass="cp-transfer-dialog"
>
  <ng-template pTemplate="header">
    <div class="flex items-center gap-3.5">
      <span
        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-[10px] bg-[rgba(20,48,73,0.06)]"
      >
        <i
          class="pi pi-arrow-right-arrow-left text-[1.05rem] text-brand-navy"
          aria-hidden="true"
        ></i>
      </span>
      <div class="flex flex-col gap-[0.1rem]">
        <h2
          class="m-0 text-[1.05rem] font-extrabold leading-tight tracking-[-0.03em] text-brand-navy"
        >
          {{ t().contenedores.transfer.title }}
        </h2>
        <p class="m-0 text-[0.75rem] tracking-[0.01em] text-brand-muted">
          {{ t().contenedores.transfer.subtitle }}
        </p>
      </div>
    </div>
  </ng-template>

  @if (visible() && contenedor(); as c) {
    <lib-contenedor-transfer-form
      [contenedor]="c"
      (transferred)="onTransferred()"
      (cancelled)="onCancel()"
    />
  }
</p-dialog>
